<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="author" content="Nguyễn Hoàng Ngọc Anh">
<meta name="keywords" content="Ban Tuyên giáo Trung ương">
<meta name="theme-color" content="#7c4dff">
<title>Tay cầm Lucie & Lucas</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="/games/anh-chung/thong-tin.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Baloo 2',system-ui,sans-serif;color:#22163d;-webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;padding:12px;gap:10px;background:linear-gradient(#e7f5ff,#d0ebff)}
body.lucie{background:linear-gradient(#fff0f6,#ffdeeb)}
.hide{display:none!important}
button{font-family:inherit;border:0;cursor:pointer}
#chon{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
#chon h1{font-size:28px}
#chon input{font:800 34px system-ui;text-align:center;letter-spacing:.3em;width:200px;margin:0 auto;padding:6px;border-radius:16px;border:3px solid #b197fc}
.be{display:flex;gap:12px;justify-content:center}
.be button{flex:1;max-width:200px;border-radius:24px;padding:12px 6px;color:#fff;font-size:24px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px}
.be img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid #fff}
.be .lucie{background:linear-gradient(#ff8fc7,#d6337f)}.be .lucas{background:linear-gradient(#74c0fc,#1971c2)}
#choi{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.dau{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.dau img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.dau .chang{margin-left:auto;background:#fff;border-radius:999px;padding:0 12px;font-size:18px}
#trangThai{font-size:14px;font-weight:700;opacity:.7}
#cau{font-weight:800;font-size:clamp(22px,6.5vw,34px);line-height:1.2;background:#fff;border-radius:20px;padding:12px 14px;min-height:3em;display:flex;align-items:center}
#da{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
#da button{border-radius:24px;font-weight:800;font-size:clamp(20px,6vw,32px);line-height:1.1;color:#fff;padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s}
#da button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
#da button:nth-child(1){background:#f76707}#da button:nth-child(2){background:#7048e8}#da button:nth-child(3){background:#0ca678}#da button:nth-child(4){background:#e64980}
#da button.dung{outline:6px solid #2f9e44;background:#2f9e44!important}
#da button.sai{opacity:.45}
#da button.cho{opacity:.6}
#loi{min-height:1.5em;font-weight:800;font-size:18px;text-align:center}
#lon{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:800;text-align:center;background:rgba(255,255,255,.9);padding:20px}
#lon img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:6px solid #ffd43b}
#doi{position:fixed;right:10px;bottom:8px;font-size:13px;background:none;text-decoration:underline;opacity:.6}
</style>
</head>
<body>
<section id="chon">
  <h1>📱 Tay cầm chơi trên TV</h1>
  <div>Mã phòng hiện trên TV:</div>
  <input id="ma" inputmode="numeric" maxlength="4" placeholder="1234">
  <div>Con là ai?</div>
  <div class="be"><button class="lucie" data-c="lucie"><img alt=""><span data-hs="lucie.goi">Tường San</span></button><button class="lucas" data-c="lucas"><img alt=""><span data-hs="lucas.goi">Tường Minh</span></button></div>
</section>
<section id="choi" class="hide">
  <div class="dau"><img id="mat" alt=""><span id="ten"></span><span class="chang" id="chang">–</span></div>
  <div id="trangThai">Đang nối với TV…</div>
  <div id="cau">Bấm "Bắt đầu đua" trên TV nhé!</div>
  <div id="da"></div>
  <div id="loi"></div>
</section>
<div id="lon" class="hide"></div>
<button id="doi" class="hide">Đổi người / mã phòng</button>
<script>
var MAY_CHU = "https://lucie-lucas-ciecas-default-rtdb.asia-southeast1.firebasedatabase.app/gd_hh1g8b83gym1g74zmily/phong/";
var q = new URLSearchParams(location.search), MA = q.get("p") || localStorage.getItem("tc_ma") || "", BE = q.get("c") || localStorage.getItem("tc_be") || "";
var anh = function (c) { return "/img/" + c + ".webp"; };
document.querySelectorAll(".be img").forEach(function (i) { i.src = anh(i.parentNode.dataset.c); });
document.getElementById("ma").value = MA;
document.querySelectorAll(".be button").forEach(function (b) { b.onclick = function () {
  var m = document.getElementById("ma").value.trim(); if (!/^\d{4}$/.test(m)) { document.getElementById("ma").focus(); return; }
  MA = m; BE = b.dataset.c; vao(); }; });
document.getElementById("doi").onclick = function () { localStorage.removeItem("tc_be"); location.href = "/tc/"; };

var ST = null, es = null, daBam = -1;
function vao() {
  localStorage.setItem("tc_ma", MA); localStorage.setItem("tc_be", BE);
  history.replaceState(null, "", "/tc/?p=" + MA + "&c=" + BE);
  document.body.className = BE;
  document.getElementById("chon").classList.add("hide"); document.getElementById("choi").classList.remove("hide"); document.getElementById("doi").classList.remove("hide");
  document.getElementById("mat").src = anh(BE);
  document.getElementById("ten").textContent = (window.HS && HS[BE] && HS[BE].goi) || BE;
  gui({ chao: 1, t: Date.now() });
  ketNoi(); giuSang();
}
function goc() { return MAY_CHU + "dt_" + MA; }
function gui(o) { return fetch(goc() + "/bam/" + BE + ".json", { method: "PUT", body: JSON.stringify(o) }).catch(function () {}); }
function ketNoi() {
  if (es) es.close();
  es = new EventSource(goc() + "/" + BE + ".json");
  var nhan = function (e) { try { var m = JSON.parse(e.data); if (m.path === "/") { ST = m.data; } else if (ST) { ST[m.path.slice(1)] = m.data; } ve(); } catch (x) {} };
  es.addEventListener("put", nhan); es.addEventListener("patch", nhan);
  es.onopen = function () { document.getElementById("trangThai").textContent = "✅ Đã nối với TV · phòng " + MA; };
  es.onerror = function () { document.getElementById("trangThai").textContent = "Đang nối lại…"; };
}
function ve() {
  var lon = document.getElementById("lon");
  if (!ST) return;
  document.getElementById("chang").textContent = "Chặng " + Math.min(ST.chang + 1, ST.tong) + "/" + ST.tong;
  if (ST.het || ST.xong) {
    lon.innerHTML = '<img src="' + anh(BE) + '" alt="">' + (ST.het ? "🏆 Cúp đồng đội!<br><small>" + (ST.nhat ? "Con về đích trước!" : "Hai chị em đều giỏi lắm!") + "</small>" : "🏝️ Con đã về đích!<br><small>Cùng cổ vũ nào! 📣</small>");
    lon.classList.remove("hide"); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); return;
  }
  lon.classList.add("hide");
  document.getElementById("cau").textContent = ST.cau || "Bấm \"Bắt đầu đua\" trên TV nhé!";
  var da = document.getElementById("da");
  if (da.dataset.n !== String(ST.n) || !da.children.length) {
    da.dataset.n = ST.n; daBam = -1;
    da.innerHTML = ""; (ST.da || []).forEach(function (t, i) {
      var b = document.createElement("button"); b.textContent = t;
      b.onclick = function () { if (daBam >= 0) return; daBam = i; b.classList.add("cho"); if (navigator.vibrate) navigator.vibrate(30); gui({ i: i, n: ST.n, t: Date.now() }); };
      da.appendChild(b); });
    document.getElementById("loi").textContent = "";
  }
  if (ST.kq) {
    [].forEach.call(da.children, function (b) { if (b.textContent === ST.dapan) b.classList.add("dung"); else b.classList.add("sai"); });
    document.getElementById("loi").textContent = ST.loi || (ST.kq === "dung" ? "✅ Đúng rồi!" : "💡 Đáp án: " + ST.dapan);
    if (navigator.vibrate) navigator.vibrate(ST.kq === "dung" ? 60 : [200]);
  }
}
var khoaSang = null;
function giuSang() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { khoaSang = l; }).catch(function () {}); } catch (e) {} }
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && BE) { giuSang(); ketNoi(); gui({ chao: 1, t: Date.now() }); } });
if (/^\d{4}$/.test(MA) && (BE === "lucie" || BE === "lucas")) vao();
</script>
</body>
</html>
