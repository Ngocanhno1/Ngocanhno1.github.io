name: Tự đọc giọng cho game (VieNeu-TTS)

on:
  push:
    paths:
      - "games/*/index.html"
      - "games/*/truyen/**"
      - "games/sach-truyen/truyen/*.json"
      - "tools/doc_giong.py"
  workflow_dispatch:
  schedule:
    - cron: "7 20 * * *"   # 3 giờ 07 sáng giờ Việt Nam: đọc nốt câu mới

permissions:
  contents: write

concurrency:
  group: doc-giong
  cancel-in-progress: false

jobs:
  doc-giong:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install vieneu
      - name: Đọc các câu còn thiếu
        run: |
          git config user.name "Nguyễn Hoàng Ngọc Anh"
          git config user.email "ngocanhbtg88@users.noreply.github.com"
          python tools/doc_giong.py
