name: Gemini Dong Bo Drive

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Ma FILE_ID tren Google Drive"
        required: true
        default: "1lGOD-TINWAzHJrZxlKvXOYLZOINB7Jsc"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tai truc tiep goi ZIP tu Drive va giai nen
        env:
          FID: ${{ github.event.inputs.file_id }}
        run: |
          curl -fsSL "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=t" -o goi.zip
          unzip -tq goi.zip
          unzip -o goi.zip -x "__MACOSX/*"
          rm -f goi.zip
      - name: Day len GitHub Pages
        run: |
          git config user.name "Gemini Sync"
          git config user.email "ngocanhbtg88@gmail.com"
          git status --short
          git add -A
          git diff --cached --quiet || (git commit -m "Gemini cap nhat goi ${{ github.event.inputs.file_id }}" && git push)
