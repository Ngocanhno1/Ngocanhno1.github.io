name: Gemini Dong Bo Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tu doc danh sach DEPLOY_LATEST_ID va giai nen goi moi
        run: |
          mkdir -p .github
          touch .github/gemini_done.txt
          curl -fsSL "https://docs.google.com/document/d/10FVwm_-aHYWkTzTRvi4zuamoxtfkJguGVhCwDTc_128/export?format=txt" | grep -oE '[A-Za-z0-9_-]{25,}' > ids.txt
          while IFS= read -r FID || [ -n "$FID" ]; do
            [ -z "$FID" ] && continue
            if ! grep -qxF "$FID" .github/gemini_done.txt; then
              echo "Dang tai goi moi: $FID"
              curl -fsSL "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=t" -o goi.zip
              unzip -tq goi.zip
              unzip -o goi.zip -x "__MACOSX/*"
              rm -f goi.zip
              echo "$FID" >> .github/gemini_done.txt
            fi
          done < ids.txt
          rm -f ids.txt
          [ -f "games/sach-truyen/truyen/gop_lich_1_ngay.py" ] && python3 games/sach-truyen/truyen/gop_lich_1_ngay.py
      - name: Day len GitHub Pages
        run: |
          git config user.name "Gemini Sync"
          git config user.email "ngocanhbtg88@gmail.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Gemini tu dong cap nhat tu Drive" && git pull --rebase origin main && git push)
