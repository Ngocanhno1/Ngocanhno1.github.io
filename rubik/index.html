  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #0d0d14;
      --surface: #171722;
      --surface-2: #222232;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #a78bfa;
      --accent-strong: #7c3aed;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    .app {
      display: flex; flex-direction: column; width: 100%; height: 100dvh;
      max-width: 520px; margin: 0 auto; padding-top: var(--safe-top);
      background: var(--bg); position: relative;
    }

    /* Top Bar */
    .topbar {
      height: 46px; flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 0 10px;
      background: #12121b; border-bottom: 1px solid var(--border); z-index: 600;
    }
    .tabs { display: flex; flex: 1; justify-content: center; gap: 4px; }
    .tab-btn {
      background: transparent; border: none; color: var(--muted);
      font-size: 13px; font-weight: 700; padding: 10px 14px;
      border-bottom: 2px solid transparent; cursor: pointer; transition: color 0.15s;
    }
    .tab-btn.active { color: #fff; border-bottom-color: var(--accent); }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 16px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.92); }

    .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; position: relative; }
    .panel.active { display: flex; }

    /* ================= TAB 1: CAMERA + 3D ================= */
    .cam-half {
      height: 46%; min-height: 225px; flex-shrink: 0; display: flex; flex-direction: column;
      background: #06060a; position: relative; border-bottom: 1px solid var(--border);
    }
    .cam-stage {
      flex: 1; position: relative; overflow: hidden; background: #050509;
      display: flex; align-items: center; justify-content: center;
    }
    #liveVideo {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; background: #000;
    }
    #liveVideo::-webkit-media-controls,
    #liveVideo::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }

    /* Capture Flash */
    .cam-flash {
      position: absolute; inset: 0; z-index: 40; background: #fff;
      opacity: 0; pointer-events: none; transition: opacity 0.22s ease-out;
    }
    .cam-flash.active { opacity: 0.75; transition: none; }

    /* Start Camera Overlay */
    .cam-overlay {
      position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(circle, rgba(24,24,38,0.9), rgba(8,8,14,0.98));
    }
    .cam-overlay.hidden { display: none; }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border: none;
      border-radius: 14px; padding: 12px 22px; font-size: 14px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45); cursor: pointer;
    }
    .btn-primary:active { transform: scale(0.95); }

    /* 3x3 Scanning Grid */
    .scan-grid {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 120px; height: 120px; z-index: 20; opacity: 0;
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 5px; padding: 5px; border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 12px;
      pointer-events: none;
      transition: left 0.12s linear, top 0.12s linear, width 0.12s linear, height 0.12s linear, opacity 0.2s, border-color 0.2s;
    }
    .scan-grid.ready {
      border-color: var(--green);
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.65);
    }
    .scan-cell {
      border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 7px;
      position: relative; display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 2px; background: rgba(0,0,0,0.04); pointer-events: none;
    }
    .scan-cell.locked::after {
      content: ""; position: absolute; top: 3px; right: 3px;
      width: 5px; height: 5px; border-radius: 50%; background: var(--green);
    }
    .scan-tag {
      font-size: 8.5px; font-weight: 800; padding: 1px 4px; border-radius: 4px;
      background: rgba(0,0,0,0.72); color: #fff; line-height: 1.15;
    }

    /* Hold-steady circular/bar progress under grid */
    .hold-bar-wrap {
      position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
      width: min(50vw, 174px); height: 5px; border-radius: 99px;
      background: rgba(255,255,255,0.16); overflow: hidden; z-index: 22; pointer-events: none;
    }
    .hold-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #a78bfa, #22c55e);
      transition: width 0.08s linear;
    }

    /* Minimal floating cam controls */
    .cam-fab-left, .cam-fab-right {
      position: absolute; top: 10px; z-index: 25;
      height: 32px; padding: 0 10px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(15,15,24,0.72);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
    }
    .cam-fab-left { left: 10px; }
    .cam-fab-right { right: 10px; }
    .cam-fab-left:active, .cam-fab-right:active { transform: scale(0.94); }

    /* Bottom Half: Centerpiece 3D Cube */
    .cube-half {
      flex: 1; display: flex; flex-direction: column; position: relative;
      background: radial-gradient(circle at 50% 42%, #1b1b2b 0%, #0d0d14 75%);
      overflow: hidden; padding-bottom: var(--safe-bottom);
    }
    .face-dots {
      display: flex; justify-content: center; gap: 6px; padding: 10px 10px 0; z-index: 20;
    }
    .fdot {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 99px;
      background: rgba(255,255,255,0.06); border: 1px solid transparent;
      font-size: 10px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .fdot .c { width: 8px; height: 8px; border-radius: 50%; }
    .fdot.active { border-color: var(--accent); color: #fff; background: rgba(167,139,250,0.16); }
    .fdot.done { border-color: rgba(34,197,94,0.5); color: #86efac; }

    .cube-stage {
      flex: 1; position: relative; width: 100%; min-height: 180px;
    }
    #scanCanvas { width: 100%; height: 100%; display: block; }

    /* Curved Arrow Overlay on 3D Cube */
    .turn-arrow-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 15;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
    }
    .turn-arrow-overlay.show { opacity: 1; }
    .turn-arrow-svg {
      width: 190px; height: 190px;
      filter: drop-shadow(0 0 12px rgba(167, 139, 250, 0.85));
    }

    .scan-status-pill {
      position: absolute; bottom: calc(10px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
      padding: 6px 14px; border-radius: 99px; background: rgba(20,20,32,0.85);
      border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: #e2e8f0;
      white-space: nowrap; z-index: 20; pointer-events: none;
    }

    /* ================= TAB 2: 3D INSPECT & TAP-TO-EDIT ================= */
    .edit-cube-stage { flex: 1; position: relative; min-height: 220px; }
    #editCanvas { width: 100%; height: 100%; display: block; }
    .edit-status {
      margin: 8px 12px 0; padding: 8px 12px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 12px; font-weight: 600; text-align: center; color: #e2e8f0;
    }
    .edit-status.err { border-color: rgba(239,68,68,0.6); color: #fca5a5; }
    .edit-status.ok { border-color: rgba(34,197,94,0.6); color: #86efac; }
    .palette-dock {
      padding: 10px 12px calc(12px + var(--safe-bottom));
      background: #12121b; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 10px;
    }
    .palette-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .pal-btn {
      height: 44px; border-radius: 10px; border: 2px solid transparent;
      background: var(--surface-2); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; cursor: pointer;
    }
    .pal-btn.selected { border-color: #fff; transform: translateY(-2px); }
    .pal-dot { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.3); }
    .pal-cnt { font-size: 10px; font-weight: 800; color: #cbd5e1; }
    .edit-actions { display: flex; gap: 8px; }
    .btn-ghost {
      flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-2); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-solve {
      flex: 1.6; height: 42px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #16a34a, #059669); color: #fff;
      font-size: 14px; font-weight: 800; cursor: pointer;
    }

    /* ================= TAB 3: KOCIEMBA 3D SOLVER ================= */
    .solve-top {
      padding: 10px 14px 6px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    .solve-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 700; color: var(--muted);
    }
    .prog-bar { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8b5cf6, #22c55e); transition: width 0.25s; }
    .move-hero {
      display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 12px 0;
    }
    .move-badge {
      min-width: 52px; height: 44px; padding: 0 12px; border-radius: 12px;
      background: var(--accent-strong); color: #fff; font-size: 22px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .move-text { font-size: 14px; font-weight: 700; color: #fff; }
    .solver-stage { flex: 1; position: relative; min-height: 200px; }
    #solverCanvas { width: 100%; height: 100%; display: block; }
    .moves-strip {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px;
      background: #12121b; border-top: 1px solid var(--border); scrollbar-width: none; flex-shrink: 0;
    }
    .moves-strip::-webkit-scrollbar { display: none; }
    .mchip {
      padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--muted); font-size: 12px; font-weight: 800; flex-shrink: 0; cursor: pointer;
    }
    .mchip.done { background: rgba(34,197,94,0.18); border-color: rgba(34,197,94,0.5); color: #86efac; }
    .mchip.cur { background: var(--accent-strong); border-color: #fff; color: #fff; }

    .solver-dock {
      padding: 8px 12px calc(12px + var(--safe-bottom));
      background: #12121b; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .ctrl-row { display: flex; gap: 8px; }
    .speed-row { display: flex; gap: 6px; }
    .sp-btn {
      flex: 1; height: 28px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .sp-btn.active { background: rgba(167,139,250,0.22); border-color: var(--accent); color: #fff; }

    .toast {
      position: fixed; top: calc(54px + var(--safe-top)); left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(20,20,34,0.95); border: 1px solid var(--accent); color: #fff;
      padding: 7px 14px; border-radius: 99px; font-size: 12px; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; z-index: 2000;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="btnReset" title="Làm mới">↺</button>
    <div class="tabs">
      <button class="tab-btn active" data-tab="scan">Máy ảnh</button>
      <button class="tab-btn" data-tab="edit">Khối 3D</button>
      <button class="tab-btn" data-tab="solve">Giải</button>
    </div>
    <button class="icon-btn" id="btnTest" title="Chạy thử">⚡</button>
  </header>

  <!-- ==================== TAB 1: CAMERA + 3D ==================== -->
  <section class="panel active" id="panel-scan">
    <div class="cam-half">
      <div class="cam-stage">
        <video id="liveVideo" autoplay playsinline webkit-playsinline muted></video>
        <div class="cam-flash" id="camFlash"></div>

        <button class="cam-fab-left" id="btnToggleCam">🎥 Bật</button>
        <button class="cam-fab-right" id="btnFlipCam">🔄 Đổi cam</button>

        <div class="cam-overlay" id="camOverlay">
          <button class="btn-primary" id="btnStartCamBig">🎥 Bật Camera</button>
        </div>

        <div class="scan-grid" id="scanGrid"></div>
        <button id="btnShoot" style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,0.25);font-size:22px;color:#fff;">📸</button>
        <div class="hold-bar-wrap"><div class="hold-bar-fill" id="holdBar"></div></div>
      </div>
    </div>

    <div class="cube-half">
      <div class="face-dots" id="faceDots"></div>
      <div class="cube-stage">
        <canvas id="scanCanvas"></canvas>
        <div class="turn-arrow-overlay" id="turnArrowOverlay"></div>
      </div>
      <div class="scan-status-pill" id="scanStatusPill">Đưa mặt Xanh Lá (Trắng ở trên)</div>
    </div>
  </section>

  <!-- ==================== TAB 2: 3D INSPECT & EDIT ==================== -->
  <section class="panel" id="panel-edit">
    <div class="edit-status" id="editStatus">Chạm ô trên khối 3D để sửa màu</div>
    <div class="edit-cube-stage">
      <canvas id="editCanvas"></canvas>
    </div>
    <div class="palette-dock">
      <div class="palette-row" id="paletteRow"></div>
      <div class="edit-actions">
        <button class="btn-ghost" id="btnBackScan">Quét lại</button>
        <button class="btn-solve" id="btnRunSolve">Giải Kociemba ➔</button>
      </div>
    </div>
  </section>

  <!-- ==================== TAB 3: KOCIEMBA 3D SOLVER ==================== -->
  <section class="panel" id="panel-solve">
    <div class="solve-top">
      <div class="solve-meta">
        <span id="solveStepText">0 / 0</span>
        <span id="solvePctText">0%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="solveProgFill"></div></div>
      <div class="move-hero">
        <div class="move-badge" id="moveBadge">✓</div>
        <div class="move-text" id="moveText">Sẵn sàng</div>
      </div>
    </div>

    <div class="solver-stage">
      <canvas id="solverCanvas"></canvas>
    </div>

    <div class="moves-strip" id="movesStrip"></div>

    <div class="solver-dock">
      <div class="ctrl-row">
        <button class="btn-ghost" id="btnPrevMove">◀ Lùi</button>
        <button class="btn-primary" style="flex:1.4;padding:0;height:42px;border-radius:12px;" id="btnPlayPause">▶ Chạy</button>
        <button class="btn-ghost" id="btnNextMove">Tiếp ▶</button>
      </div>
      <div class="speed-row">
        <button class="sp-btn" data-ms="1300">Chậm</button>
        <button class="sp-btn active" data-ms="750">Vừa</button>
        <button class="sp-btn" data-ms="420">Nhanh</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<canvas id="sampleCanvas" width="180" height="180" style="display:none"></canvas>

<script>
// ==================== CONSTANTS ====================
const COLORS = {
  U: { name: 'Trắng',      short: 'Trắng',   hex: '#f8fafc', text: '#0f172a' },
  R: { name: 'Đỏ',         short: 'Đỏ',      hex: '#ef4444', text: '#ffffff' },
  F: { name: 'Xanh Lá',    short: 'X.Lá',    hex: '#22c55e', text: '#052e16' },
  D: { name: 'Vàng',       short: 'Vàng',    hex: '#facc15', text: '#422006' },

// ==================== PRESERVED HSV COLOR CLASSIFIER ====================
const DEFAULT_HUE = { R: 355, L: 20, D: 55, F: 130, B: 220 };
let calibratedLab = {}; // calibratedLab[face] = HSV of center when saved
let calibratedSet = new Set();

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let hh = 0;
  if (d > 1e-6) {
    if (mx === r) hh = ((g - b) / d) % 6;
    else if (mx === g) hh = (b - r) / d + 2;
    else hh = (r - g) / d + 4;
    hh *= 60; if (hh < 0) hh += 360;
  }
  return [hh, mx === 0 ? 0 : d / mx, mx];
}

function warmSplit() {
  let split = 12;
  if (calibratedSet.has('R') && calibratedSet.has('L')) {
    let hr = calibratedLab.R[0]; if (hr > 300) hr -= 360;
    const hl = calibratedLab.L[0];
    if (hl > hr) split = (hr + hl) / 2;
  }
  return Math.max(8, Math.min(15, split));
}

function classifyLab(hsv) {
  const [hh, s, v] = hsv;
  let whiteSat = 0.30;
  if (calibratedSet.has('U') && calibratedLab.U) whiteSat = Math.min(0.42, Math.max(0.22, calibratedLab.U[1] + 0.14));
  if (s < whiteSat && v > 0.35) return { color: 'U', de: 0, conf: (whiteSat - s) * 100 };
  const nh = hh > 300 ? hh - 360 : hh;
  if (nh < 40) {
    const sp = warmSplit();
    return nh < sp ? { color: 'R', de: 0, conf: sp - nh } : { color: 'L', de: 0, conf: Math.min(nh - sp, 40 - nh) };
  }
  if (hh < 78) return { color: 'D', de: 0, conf: Math.min(hh - 40, 78 - hh) };
  if (hh < 185) return { color: 'F', de: 0, conf: Math.min(hh - 78, 185 - hh) };
  if (hh < 290) return { color: 'B', de: 0, conf: Math.min(hh - 185, 290 - hh) };
  return { color: 'R', de: 0, conf: 5 };
}

function medianOf(arr) {
  arr.sort((a, b) => a - b);
  const m = arr.length >> 1;
  return arr.length % 2 ? arr[m] : (arr[m - 1] + arr[m]) * 0.5;
}

// ==================== TỰ TÌM KHỐI RUBIK Ở BẤT KỲ ĐÂU TRONG KHUNG HÌNH ====================
let lastDetection = null;
const DET_W = 192;
const detCanvas = document.createElement('canvas');
const detCtx = detCanvas.getContext('2d', { willReadFrequently: true });
const LBL = { U: 0, R: 1, F: 2, D: 3, L: 4, B: 5 };

function detectCubeFace(sw, sh) {
  const W = DET_W, H = Math.max(40, Math.round(DET_W * sh / sw));
  if (detCanvas.width !== W || detCanvas.height !== H) { detCanvas.width = W; detCanvas.height = H; }
  detCtx.drawImage(videoEl, 0, 0, W, H);
  const px = detCtx.getImageData(0, 0, W, H).data;
  const N = W * H, lab = new Int8Array(N);
  for (let p = 0, q = 0; p < N; p++, q += 4) {
    const hsv = rgbToHsv(px[q], px[q + 1], px[q + 2]);
    lab[p] = hsv[2] < 0.24 ? -1 : LBL[classifyLab(hsv).color];
  }
  // Vùng liền màu (ô dán) — tách bởi viền đen của khối
  const seen = new Uint8Array(N), stack = new Int32Array(N), blobs = [];
  const maxArea = N * 0.08;
  for (let s0 = 0; s0 < N; s0++) {
    if (seen[s0] || lab[s0] < 0) continue;
    const L = lab[s0]; let top = 0, area = 0, minx = W, maxx = 0, miny = H, maxy = 0, sx = 0, sy = 0;
    stack[top++] = s0; seen[s0] = 1;
    while (top) {
      const p = stack[--top], x = p % W, y = (p / W) | 0;
      area++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (x > 0 && !seen[p - 1] && lab[p - 1] === L) { seen[p - 1] = 1; stack[top++] = p - 1; }
      if (x < W - 1 && !seen[p + 1] && lab[p + 1] === L) { seen[p + 1] = 1; stack[top++] = p + 1; }
      if (y > 0 && !seen[p - W] && lab[p - W] === L) { seen[p - W] = 1; stack[top++] = p - W; }
      if (y < H - 1 && !seen[p + W] && lab[p + W] === L) { seen[p + W] = 1; stack[top++] = p + W; }
    }
    const bw = maxx - minx + 1, bh = maxy - miny + 1;
    if (area < 10 || area > maxArea || bw < 3 || bh < 3) continue;
    const asp = bw / bh; if (asp < 0.45 || asp > 2.2) continue;
    if (area / (bw * bh) < 0.45) continue;
    blobs.push({ x: sx / area, y: sy / area, sz: Math.sqrt(area) });
  }
  if (blobs.length < 4) return null;
  // Tìm lưới 3x3: thử mỗi ô làm mốc, mỗi ô gần làm hướng, mỗi vị trí trong lưới
  let best = null;
  for (const c of blobs) {
    const near = blobs.filter(o => o !== c && o.sz > c.sz * 0.55 && o.sz < c.sz * 1.8)
      .map(o => ({ o, d: Math.hypot(o.x - c.x, o.y - c.y) }))
      .filter(t => t.d > c.sz * 0.9 && t.d < c.sz * 2.0)
      .sort((a, b) => a.d - b.d).slice(0, 4);
    for (const t of near) {
      const d = t.d, ux = (t.o.x - c.x) / d, uy = (t.o.y - c.y) / d, vx = -uy, vy = ux;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
        const ox = c.x - a * d * ux - b * d * vx, oy = c.y - a * d * uy - b * d * vy;
        let score = 0;
        for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
          const qx = ox + i * d * ux + j * d * vx, qy = oy + i * d * uy + j * d * vy;
          const tol = d * 0.3;
          if (blobs.some(o => Math.abs(o.x - qx) < tol && Math.abs(o.y - qy) < tol && o.sz > c.sz * 0.5 && o.sz < c.sz * 2)) score++;
        }
        if (!best || score > best.score || (score === best.score && d > best.d))
          best = { score, ox, oy, d, ux, uy };
      }
    }
  }
  if (!best || best.score < 6) return null;
  // Chuẩn hoá hướng: trục "ngang" là trục gần phương ngang của ảnh
  let { ox, oy, d, ux, uy } = best;
  let vx = -uy, vy = ux;
  if (Math.abs(uy) > Math.abs(ux)) { [ux, uy, vx, vy] = [vx, vy, ux, uy]; }
  if (ux < 0) { ux = -ux; uy = -uy; }
  if (vy < 0) { vx = -vx; vy = -vy; }
  // Lấy mẫu trung vị quanh tâm mỗi ô
  const hsvs = [], r = Math.max(1, Math.round(d * 0.22));
  for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
    const cx = ox + (col - 1) * d * ux + (row - 1) * d * vx, cy = oy + (col - 1) * d * uy + (row - 1) * d * vy;
    const rs = [], gs = [], bs = [];
    for (let y = Math.round(cy - r); y <= Math.round(cy + r); y++) for (let x = Math.round(cx - r); x <= Math.round(cx + r); x++) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const q = (y * W + x) * 4; rs.push(px[q]); gs.push(px[q + 1]); bs.push(px[q + 2]);
    }
    hsvs.push(rs.length ? rgbToHsv(medianOf(rs), medianOf(gs), medianOf(bs)) : [0, 0, 0.5]);
  }
  return { hsv: hsvs, ox, oy, d, ux, uy, W, H };
}

function positionScanGrid(det, sw, sh) {
  const g = document.getElementById('scanGrid');
  if (!det) { g.style.opacity = '0'; return; }
  const stageR = document.querySelector('.cam-stage').getBoundingClientRect();
  const scale = Math.max(stageR.width / sw, stageR.height / sh);
  const offX = (stageR.width - sw * scale) / 2, offY = (stageR.height - sh * scale) / 2;
  const k = (sw / det.W) * scale;
  const cx = det.ox * k + offX, cy = det.oy * k + offY, size = det.d * 3 * k;
  const ang = Math.atan2(det.uy, det.ux) * 180 / Math.PI;
  g.style.opacity = '1';
  g.style.width = g.style.height = size + 'px';
  g.style.left = cx + 'px'; g.style.top = cy + 'px';
  g.style.transform = `translate(-50%, -50%) rotate(${ang}deg)`;
}

function processFrame() {
  if (!isCamOn || videoEl.readyState < 2) return;
  const sw = videoEl.videoWidth, sh = videoEl.videoHeight;
  if (!sw || !sh) return;

  const expectedFace = SCAN_ORDER[currentStep].face;
  const det = detectCubeFace(sw, sh);
  lastDetection = det;
  positionScanGrid(det, sw, sh);
  if (!det) {
    // Không thấy khối: không chốt, không đếm giữ yên
    resetStreaks();
    for (let i = 0; i < 9; i++) liveColors[i] = null;
    renderScanGrid();
    return;
  }
  for (let i = 0; i < 9; i++) {
    const hsv = det.hsv[i];
    liveHsvs[i] = hsv;
    const res = classifyLab(hsv);
    const st = streaks[i];
    if (st.color === res.color) st.count = Math.min(3, st.count + 1);
    else { st.color = res.color; st.count = 1; st.locked = false; }
    if (st.count >= 3) { st.locked = true; liveColors[i] = res.color; liveConfs[i] = res.conf; }
  }

  renderScanGrid();

  // Requirement 5: Only start capturing next face once center changes to expected color
  if (waitingForNewCenter) {
    if (streaks[4].locked && liveColors[4] === expectedFace) {
      waitingForNewCenter = false;
      isGuidingTurn = false;
      document.getElementById('turnArrowOverlay').classList.remove('show');
      document.getElementById('scanStatusPill').textContent = `Giữ yên mặt ${COLORS[expectedFace].name}...`;
      resetStreaks();
    }
    return;
  }

  if (isGuidingTurn) return;

  // Live update 3D cube with current detected colors
  syncScanCube3D();

  // Requirement 3: All 9 cells locked + center matches expectedFace -> hold ~1s -> auto-capture
  const allLocked = streaks.every(s => s.locked) && liveColors[4] === expectedFace;
  const gridEl = document.getElementById('scanGrid');
  const holdBar = document.getElementById('holdBar');

  if (allLocked) {
    gridEl.classList.add('ready');
    if (!holdStartTime) holdStartTime = performance.now();
    const elapsed = performance.now() - holdStartTime;
    const pct = Math.min(100, (elapsed / HOLD_MS) * 100);
    holdBar.style.width = pct + '%';
    if (elapsed >= HOLD_MS) {
      autoCaptureCurrentFace();
    }
  } else {
    gridEl.classList.remove('ready');
    holdStartTime = 0;
    holdBar.style.width = '0%';
  }
}

function autoCaptureCurrentFace() {
  const info = SCAN_ORDER[currentStep];
  scannedFaces[info.face] = [...liveColors];
  scannedConf[info.face] = [...liveConfs];

  // Calibrate center HSV
  if (liveHsvs[4]) {
    calibratedLab[info.face] = [...liveHsvs[4]];
    calibratedSet.add(info.face);
  }

  // Flash + Vibrate
  const fl = document.getElementById('camFlash');
  fl.classList.add('active');
  setTimeout(() => fl.classList.remove('active'), 120);
  if (navigator.vibrate) navigator.vibrate(45);

  resetStreaks();
  renderFaceDots();
  syncScanCube3D();

  if (currentStep < 5) {
    const nextIdx = currentStep + 1;
    const nextInfo = SCAN_ORDER[nextIdx];
    currentStep = nextIdx;
    waitingForNewCenter = true;
    isGuidingTurn = true;
    renderFaceDots();
    scanCube.setActiveFace(nextInfo.face);

    document.getElementById('scanStatusPill').textContent = nextInfo.hint;
    const arrowOv = document.getElementById('turnArrowOverlay');
    arrowOv.innerHTML = getArrowSVG(info.arrowType);
    arrowOv.classList.add('show');

    // Animate 3D cube rotating smoothly (~1s easing), repeating 2 times
    scanCube.playGuidanceTurn(info.rx, info.ry, nextInfo.rx, nextInfo.ry, 2, () => {
      // Keep arrow visible until user actually turns real cube to new center
      if (!waitingForNewCenter) arrowOv.classList.remove('show');
    });
  } else {
    // All 6 faces scanned -> validate -> solve or edit on 3D cube
    stopCamera(true);
    const state54 = getState54();
    const val = validateCube54(state54);
    if (val.ok) {
      startKociembaSolve(state54);
    } else {
      switchTab('edit');
      showToast('Chạm ô nhấp nháy trên khối 3D để sửa');
    }
  }
}

// ==================== THREE.JS RUBIK 3D ENGINE ====================
function createRubik3D(canvasId, opts = {}) {
  const canvas = document.getElementById(canvasId);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 8.2);
  scene.add(new THREE.AmbientLight(0xffffff, 0.88));
  const dir = new THREE.DirectionalLight(0xffffff, 0.42);
  dir.position.set(5, 7, 9);
  scene.add(dir);

  const root = new THREE.Group();
  scene.add(root);

  const pivot = new THREE.Group();
  root.add(pivot);

  // Build 27 cubies & 54 sticker meshes attached to their respective cubies
  const cubies = [];
  const stickerMeshes = new Array(54);
  const baseGeo = new THREE.BoxGeometry(0.95, 0.95, 0.95);
  const baseMat = new THREE.MeshLambertMaterial({ color: 0x15151e });
  const stickerGeo = new THREE.PlaneGeometry(0.81, 0.81);

  const cubieMap = {};
  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        const g = new THREE.Group();
        g.position.set(x, y, z);
        g.userData = { gx: x, gy: y, gz: z };
        g.add(new THREE.Mesh(baseGeo, baseMat));
        root.add(g);
        cubies.push(g);
        cubieMap[`${x},${y},${z}`] = g;
      }
    }
  }

  function attachSticker(idx, cx, cy, cz, lx, ly, lz, rx, ry, rz) {
    const mat = new THREE.MeshBasicMaterial({ color: 0x2a2a38 });
    const mesh = new THREE.Mesh(stickerGeo, mat);
    mesh.position.set(lx, ly, lz);
    mesh.rotation.set(rx, ry, rz);
    mesh.userData = { stickerIdx: idx };
    cubieMap[`${cx},${cy},${cz}`].add(mesh);
    stickerMeshes[idx] = mesh;
  }

  const e = 0.482;
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const i = r * 3 + c;
      attachSticker(0  + i, c - 1,  1, r - 1,   0,  e,  0, -Math.PI/2, 0, 0); // U
      attachSticker(9  + i,  1, 1 - r, 1 - c,   e,  0,  0,  0, Math.PI/2, 0); // R
      attachSticker(18 + i, c - 1, 1 - r,  1,   0,  0,  e,  0, 0, 0);         // F
      attachSticker(27 + i, c - 1, -1, 1 - r,   0, -e,  0,  Math.PI/2, 0, 0); // D
      attachSticker(36 + i, -1, 1 - r, c - 1,  -e,  0,  0,  0, -Math.PI/2, 0);// L
      attachSticker(45 + i, 1 - c, 1 - r, -1,   0,  0, -e,  0, Math.PI, 0);   // B
    }
  }

  // Glowing active face border (for scanner)
  const borderGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(3.04, 3.04, 0.04));
  const borderMat = new THREE.LineBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.95 });
  const activeBorder = new THREE.LineSegments(borderGeo, borderMat);
  activeBorder.visible = !!opts.showActiveBorder;
  root.add(activeBorder);

  function setActiveFace(face) {
    if (!opts.showActiveBorder) return;
    activeBorder.visible = true;
    const d = 1.52;
    if (face === 'F') { activeBorder.position.set(0, 0, d);  activeBorder.rotation.set(0, 0, 0); }
    if (face === 'B') { activeBorder.position.set(0, 0, -d); activeBorder.rotation.set(0, 0, 0); }
    if (face === 'R') { activeBorder.position.set(d, 0, 0);  activeBorder.rotation.set(0, Math.PI/2, 0); }
    if (face === 'L') { activeBorder.position.set(-d, 0, 0); activeBorder.rotation.set(0, Math.PI/2, 0); }
    if (face === 'U') { activeBorder.position.set(0, d, 0);  activeBorder.rotation.set(Math.PI/2, 0, 0); }
    if (face === 'D') { activeBorder.position.set(0, -d, 0); activeBorder.rotation.set(Math.PI/2, 0, 0); }
  }

  // Rotation & interaction
  let targetRX = 0.34, targetRY = -0.38, curRX = 0.34, curRY = -0.38;
  let dragging = false, downX = 0, downY = 0, lastX = 0, lastY = 0, movedDist = 0;
  let guideAnim = null;
  let layerAnim = null;
  let blinkingIndices = new Set();
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  canvas.addEventListener('pointerdown', ev => {
    dragging = true; downX = lastX = ev.clientX; downY = lastY = ev.clientY; movedDist = 0;
  });
  window.addEventListener('pointermove', ev => {
    if (!dragging) return;
    const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
    movedDist += Math.hypot(dx, dy);
    targetRY += dx * 0.011;
    targetRX = Math.max(-1.45, Math.min(1.45, targetRX + dy * 0.011));
    lastX = ev.clientX; lastY = ev.clientY;
  });
  window.addEventListener('pointerup', ev => {
    if (!dragging) return;
    dragging = false;
    if (opts.onStickerTap && movedDist < 8) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(stickerMeshes, false);
      if (hits.length > 0) opts.onStickerTap(hits[0].object.userData.stickerIdx);
    }
  });

  function setTargetRot(rx, ry) {
    guideAnim = null;
    targetRX = rx; targetRY = ry;
  }

  // Smooth guidance animation repeating `reps` times
  function playGuidanceTurn(fromRX, fromRY, toRX, toRY, reps, onDone) {
    guideAnim = {
      fromRX, fromRY, toRX, toRY,
      reps, curRep: 0, start: performance.now(), dur: 1000, pause: 260, onDone
    };
  }

  function setStickers(arr54) {
    for (let i = 0; i < 54; i++) {
      const k = arr54[i];
      stickerMeshes[i].userData.baseHex = k ? COLORS[k].hex : '#2a2a38';
      stickerMeshes[i].material.color.set(stickerMeshes[i].userData.baseHex);
    }
  }

  function setBlinking(idxSet) { blinkingIndices = idxSet; }

  // Real 3D layer turn animation
  function animateLayerMove(move, durationMs, onComplete) {
    const f = move[0];
    const mult = move.length === 1 ? 1 : (move[1] === "'" ? -1 : 2);
    let axis = 'y', layerVal = 1, baseAngle = -Math.PI / 2;
    if (f === 'U') { axis = 'y'; layerVal = 1;  baseAngle = -Math.PI / 2; }
    if (f === 'D') { axis = 'y'; layerVal = -1; baseAngle =  Math.PI / 2; }
    if (f === 'R') { axis = 'x'; layerVal = 1;  baseAngle = -Math.PI / 2; }
    if (f === 'L') { axis = 'x'; layerVal = -1; baseAngle =  Math.PI / 2; }
    if (f === 'F') { axis = 'z'; layerVal = 1;  baseAngle = -Math.PI / 2; }
    if (f === 'B') { axis = 'z'; layerVal = -1; baseAngle =  Math.PI / 2; }

    const activeCubies = cubies.filter(c => {
      if (axis === 'x') return c.userData.gx === layerVal;
      if (axis === 'y') return c.userData.gy === layerVal;
      return c.userData.gz === layerVal;
    });

    pivot.rotation.set(0, 0, 0);
    activeCubies.forEach(c => pivot.attach(c));
    layerAnim = {
      axis, targetAngle: baseAngle * mult,
      start: performance.now(), dur: durationMs, activeCubies, onComplete
    };
  }

  function resize() {
    const p = canvas.parentElement;
    if (!p || !p.clientWidth || !p.clientHeight) return;
    renderer.setSize(p.clientWidth, p.clientHeight, false);
    camera.aspect = p.clientWidth / p.clientHeight;
    camera.updateProjectionMatrix();
  }

  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

  function loop(now) {
    requestAnimationFrame(loop);

    if (guideAnim) {
      const elapsed = now - guideAnim.start;
      const cycle = guideAnim.dur + guideAnim.pause;
      if (elapsed >= cycle) {
        guideAnim.curRep++;
        if (guideAnim.curRep >= guideAnim.reps) {
          curRX = targetRX = guideAnim.toRX;
          curRY = targetRY = guideAnim.toRY;
          const cb = guideAnim.onDone;
          guideAnim = null;
          if (cb) cb();
        } else {
          guideAnim.start = now;
        }
      } else {
        const t = Math.min(1, elapsed / guideAnim.dur);
        const e = easeInOutCubic(t);
        curRX = targetRX = guideAnim.fromRX + (guideAnim.toRX - guideAnim.fromRX) * e;
        curRY = targetRY = guideAnim.fromRY + (guideAnim.toRY - guideAnim.fromRY) * e;
      }
    } else {
      curRX += (targetRX - curRX) * 0.14;
      curRY += (targetRY - curRY) * 0.14;
    }

    root.rotation.x = curRX;
    root.rotation.y = curRY;

    // Layer turn animation
    if (layerAnim) {
      const t = Math.min(1, (now - layerAnim.start) / layerAnim.dur);
      const e = easeInOutCubic(t);
      pivot.rotation[layerAnim.axis] = layerAnim.targetAngle * e;
      if (t >= 1) {
        const { activeCubies, onComplete } = layerAnim;
        layerAnim = null;
        // Detach back to root and reset cubie transforms cleanly
        activeCubies.forEach(c => {
          root.attach(c);
          c.position.set(c.userData.gx, c.userData.gy, c.userData.gz);
          c.rotation.set(0, 0, 0);
        });
        pivot.rotation.set(0, 0, 0);
        if (onComplete) onComplete();
      }
    }

    // Blink suspect stickers on Edit 3D Cube
    if (blinkingIndices.size > 0) {
      const blink = Math.sin(now * 0.012) > 0;
      blinkingIndices.forEach(idx => {
        stickerMeshes[idx].material.color.set(blink ? '#ef4444' : '#facc15');
      });
    }

    renderer.render(scene, camera);
  }
  resize();
  requestAnimationFrame(loop);
  window.addEventListener('resize', resize);

  return { resize, setTargetRot, playGuidanceTurn, setStickers, setActiveFace, setBlinking, animateLayerMove };
}

const CORNER_POS = [[8,9,20],[6,18,38],[0,36,47],[2,45,11],[29,26,15],[27,44,24],[33,53,42],[35,17,51]];
const CORNER_COL = [['U','R','F'],['U','F','L'],['U','L','B'],['U','B','R'],['D','F','R'],['D','L','F'],['D','B','L'],['D','R','B']];
const EDGE_POS   = [[5,10],[7,19],[3,37],[1,46],[32,16],[28,25],[30,43],[34,52],[23,12],[21,41],[50,39],[48,14]];
const EDGE_COL   = [['U','R'],['U','F'],['U','L'],['U','B'],['D','R'],['D','F'],['D','L'],['D','B'],['F','R'],['F','L'],['B','L'],['B','R']];

function getState54() {
  const arr = [];
  for (const f of COLOR_KEYS) for (let i = 0; i < 9; i++) arr.push(scannedFaces[f][i] || f);
  return arr;
}

function validateCube54(s) {
  suspectSet.clear();
  const counts = { U:0, R:0, F:0, D:0, L:0, B:0 };
  for (let i = 0; i < 54; i++) counts[s[i]]++;
  const badCnt = COLOR_KEYS.filter(k => counts[k] !== 9);
  if (badCnt.length) {
    const over = new Set(COLOR_KEYS.filter(k => counts[k] > 9));
    const list = [];
    for (const f of COLOR_KEYS) for (let i = 0; i < 9; i++) if (i !== 4 && over.has(scannedFaces[f][i])) list.push({ idx: FACE_OFFSET[f]+i, conf: scannedConf[f][i] });
    list.sort((a,b) => a.conf - b.conf);
    list.slice(0, 3).forEach(x => suspectSet.add(x.idx));
    return { ok: false, msg: 'Chưa đủ 9 ô mỗi màu — chạm ô nhấp nháy trên khối 3D để sửa' };
  }

  const cPerm = [], cOri = [];
  for (let p = 0; p < 8; p++) {
    const cols = CORNER_POS[p].map(i => s[i]);
    let found = -1, ori = 0;
    for (let k = 0; k < 8; k++) {
      const ref = CORNER_COL[k];
      for (let o = 0; o < 3; o++) if (cols[0]===ref[o] && cols[1]===ref[(o+1)%3] && cols[2]===ref[(o+2)%3]) { found = k; ori = (3-o)%3; break; }
      if (found !== -1) break;
    }
    if (found === -1 || cPerm.includes(found)) {
      CORNER_POS[p].forEach(i => suspectSet.add(i));
      return { ok: false, msg: 'Viên góc không hợp lệ — chạm ô nhấp nháy để sửa' };
    }
    cPerm.push(found); cOri.push(ori);
  }
  if (cOri.reduce((a,b)=>a+b,0) % 3 !== 0) {
    highlightLowestConf(2);
    return { ok: false, msg: 'Lỗi xoắn góc — chạm ô nhấp nháy để sửa' };
  }

  const ePerm = [], eOri = [];
  for (let p = 0; p < 12; p++) {
    const [c0, c1] = EDGE_POS[p].map(i => s[i]);
    let found = -1, ori = 0;
    for (let k = 0; k < 12; k++) {
      const [r0, r1] = EDGE_COL[k];
      if (c0===r0 && c1===r1) { found=k; ori=0; break; }
      if (c0===r1 && c1===r0) { found=k; ori=1; break; }
    }
    if (found === -1 || ePerm.includes(found)) {
      EDGE_POS[p].forEach(i => suspectSet.add(i));
      return { ok: false, msg: 'Viên cạnh không hợp lệ — chạm ô nhấp nháy để sửa' };
    }
    ePerm.push(found); eOri.push(ori);
  }
  if (eOri.reduce((a,b)=>a+b,0) % 2 !== 0) {
    highlightLowestConf(2);
    return { ok: false, msg: 'Lỗi lật cạnh — chạm ô nhấp nháy để sửa' };
  }
  const par = arr => { let inv=0; for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++) if (arr[i]>arr[j]) inv++; return inv%2; };
  if (par(cPerm) !== par(ePerm)) {
    highlightLowestConf(2);
    return { ok: false, msg: 'Lỗi chẵn lẻ (Parity) — chạm ô nhấp nháy để sửa' };
  }
  return { ok: true, msg: 'Khối Rubik hợp lệ 100% — sẵn sàng giải!' };
}

function highlightLowestConf(n) {
  const list = [];
  for (const f of COLOR_KEYS) for (let i = 0; i < 9; i++) if (i !== 4) list.push({ idx: FACE_OFFSET[f]+i, conf: scannedConf[f][i] });
  list.sort((a,b) => a.conf - b.conf);
  list.slice(0, n).forEach(x => suspectSet.add(x.idx));
}

// ==================== KOCIEMBA 2-PHASE WEB WORKER ====================
const workerSrc = `
  let ready = false, err = null;
  try {
    importScripts(
      'https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.js',
      'https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.js'
    );
    Cube.initSolver();
    ready = true;
    postMessage({ type: 'ready' });
  } catch (e) {
    err = String(e);
    postMessage({ type: 'error', error: err });
  }
  onmessage = function(ev) {
    const { id, facelets } = ev.data;
    if (!ready) { postMessage({ type: 'result', id, ok: false, error: err || 'loading' }); return; }
    try {
      const c = Cube.fromString(facelets);
      const sol = c.solve();
      const moves = sol ? sol.trim().split(/\\s+/).filter(Boolean) : [];
      postMessage({ type: 'result', id, ok: true, moves });
    } catch (e) {
      postMessage({ type: 'result', id, ok: false, error: String(e) });
    }
  };
`;

let kWorker = null, reqId = 0;
const pending = new Map();
function initWorker() {
  try {
    kWorker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' })));
    kWorker.onmessage = ev => {
      if (ev.data.type === 'result') {
        const cb = pending.get(ev.data.id);
        if (cb) { pending.delete(ev.data.id); cb(ev.data); }
      }
    };
  } catch (e) { kWorker = null; }
}

// Logical move application for 3D state sync
function makeSolved() { return 'UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB'.split(''); }
function rotCW(c, o) {
  const t0=c[o],t1=c[o+1],t2=c[o+2],t3=c[o+3],t5=c[o+5],t6=c[o+6],t7=c[o+7],t8=c[o+8];
  c[o]=t6;c[o+1]=t3;c[o+2]=t0;c[o+3]=t7;c[o+5]=t1;c[o+6]=t8;c[o+7]=t5;c[o+8]=t2;
}
function applyBasic(c, m) {
  if (m==='U'){rotCW(c,0);const t=[c[18],c[19],c[20]];c[18]=c[9];c[19]=c[10];c[20]=c[11];c[9]=c[45];c[10]=c[46];c[11]=c[47];c[45]=c[36];c[46]=c[37];c[47]=c[38];c[36]=t[0];c[37]=t[1];c[38]=t[2];}
  else if (m==='D'){rotCW(c,27);const t=[c[24],c[25],c[26]];c[24]=c[42];c[25]=c[43];c[26]=c[44];c[42]=c[51];c[43]=c[52];c[44]=c[53];c[51]=c[15];c[52]=c[16];c[53]=c[17];c[15]=t[0];c[16]=t[1];c[17]=t[2];}
  else if (m==='F'){rotCW(c,18);const t=[c[6],c[7],c[8]];c[6]=c[44];c[7]=c[41];c[8]=c[38];c[44]=c[29];c[41]=c[28];c[38]=c[27];c[29]=c[9];c[28]=c[12];c[27]=c[15];c[9]=t[0];c[12]=t[1];c[15]=t[2];}
  else if (m==='B'){rotCW(c,45);const t=[c[2],c[1],c[0]];c[2]=c[17];c[1]=c[14];c[0]=c[11];c[17]=c[33];c[14]=c[34];c[11]=c[35];c[33]=c[36];c[34]=c[39];c[35]=c[42];c[36]=t[0];c[39]=t[1];c[42]=t[2];}
  else if (m==='R'){rotCW(c,9);const t=[c[8],c[5],c[2]];c[8]=c[26];c[5]=c[23];c[2]=c[20];c[26]=c[35];c[23]=c[32];c[20]=c[29];c[35]=c[45];c[32]=c[48];c[29]=c[51];c[45]=t[0];c[48]=t[1];c[51]=t[2];}
  else if (m==='L'){rotCW(c,36);const t=[c[0],c[3],c[6]];c[0]=c[53];c[3]=c[50];c[6]=c[47];c[53]=c[27];c[50]=c[30];c[47]=c[33];c[27]=c[18];c[30]=c[21];c[33]=c[24];c[18]=t[0];c[21]=t[1];c[24]=t[2];}
}
function applyMove(c, m) {
  const n = m.length === 1 ? 1 : (m[1] === "'" ? 3 : 2);
  for (let i = 0; i < n; i++) applyBasic(c, m[0]);
}
function invertMove(m) {
  if (m.length === 1) return m + "'";
  if (m[1] === "'") return m[0];
  return m;
}
function describeMove(m) {
  const f = { U:'Trên (Trắng)', D:'Dưới (Vàng)', F:'Trước (Xanh Lá)', B:'Sau (Xanh Dương)', R:'Phải (Đỏ)', L:'Trái (Cam)' }[m[0]];
  const d = m.length === 1 ? 'xuôi 90°' : (m[1] === "'" ? 'ngược 90°' : '180°');
  return `${f} • ${d}`;
}

function getCubeAtStep(step) {
  const c = [...(initialSolveState || makeSolved())];
  for (let i = 0; i < step; i++) applyMove(c, solutionMoves[i]);
  return c;
}

function startKociembaSolve(state54) {
  stopCamera(true);
  stopPlay();
  initialSolveState = [...state54];
  switchTab('solve');
  document.getElementById('moveBadge').textContent = '⏳';
  document.getElementById('moveText').textContent = 'Đang giải Kociemba...';
  if (solverCube) solverCube.setStickers(state54);

  if (!kWorker) { showToast('Lỗi Web Worker'); return; }
  const id = ++reqId;
  pending.set(id, res => {
    if (!res.ok) {
      document.getElementById('moveBadge').textContent = '⚠️';
      document.getElementById('moveText').textContent = 'Đang tải bộ giải, thử lại sau 2 giây';
      return;
    }
    solutionMoves = res.moves;
    solveIndex = 0;
    renderMovesStrip();
    updateSolverUI();
  });
  kWorker.postMessage({ id, facelets: state54.join('') });
}

function renderMovesStrip() {
  const strip = document.getElementById('movesStrip');
  strip.innerHTML = '';
  solutionMoves.forEach((m, idx) => {
    const b = document.createElement('button');
    b.className = 'mchip';
    b.textContent = `${idx + 1}.${m}`;
    b.addEventListener('click', () => {
      if (isAnimatingMove) return;
      stopPlay();
      solveIndex = idx + 1;
      solverCube.setStickers(getCubeAtStep(solveIndex));
      updateSolverUI();
    });
    strip.appendChild(b);
  });
}

function updateSolverUI() {
  const total = solutionMoves.length;
  const pct = total ? Math.round((solveIndex / total) * 100) : 100;
  document.getElementById('solveStepText').textContent = `${solveIndex} / ${total}`;
  document.getElementById('solvePctText').textContent = `${pct}%`;
  document.getElementById('solveProgFill').style.width = `${pct}%`;

  const badge = document.getElementById('moveBadge');
  const text = document.getElementById('moveText');
  if (total === 0 || solveIndex >= total) {
    badge.textContent = '🎉';
    text.textContent = 'Đã giải hoàn chỉnh!';
    stopPlay();
  } else {
    const m = solutionMoves[solveIndex];
    badge.textContent = m;
    text.textContent = describeMove(m);
  }
  document.querySelectorAll('.mchip').forEach((c, idx) => {
    c.classList.toggle('done', idx < solveIndex);
    c.classList.toggle('cur', idx === solveIndex);
    if (idx === solveIndex) c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
}

function stepForward(autoContinue = false) {
  if (isAnimatingMove || solveIndex >= solutionMoves.length) return;
  const move = solutionMoves[solveIndex];
  isAnimatingMove = true;
  solverCube.animateLayerMove(move, Math.max(240, moveAnimMs * 0.72), () => {
    solveIndex++;
    solverCube.setStickers(getCubeAtStep(solveIndex));
    updateSolverUI();
    isAnimatingMove = false;
    if (autoContinue && isPlaying && solveIndex < solutionMoves.length) {
      playTimeout = setTimeout(() => stepForward(true), Math.max(120, moveAnimMs * 0.28));
    } else if (solveIndex >= solutionMoves.length) {
      stopPlay();
    }
  });
}

function stepBackward() {
  if (isAnimatingMove || solveIndex <= 0) return;
  stopPlay();
  const inv = invertMove(solutionMoves[solveIndex - 1]);
  isAnimatingMove = true;
  solverCube.animateLayerMove(inv, Math.max(240, moveAnimMs * 0.65), () => {
    solveIndex--;
    solverCube.setStickers(getCubeAtStep(solveIndex));
    updateSolverUI();
    isAnimatingMove = false;
  });
}

function stopPlay() {
  isPlaying = false;
  if (playTimeout) { clearTimeout(playTimeout); playTimeout = null; }
  document.getElementById('btnPlayPause').textContent = '▶ Chạy';
}

function togglePlay() {
  if (isPlaying) { stopPlay(); return; }
  if (solveIndex >= solutionMoves.length) {
    solveIndex = 0;
    solverCube.setStickers(getCubeAtStep(0));
    updateSolverUI();
  }
  isPlaying = true;
  document.getElementById('btnPlayPause').textContent = '⏸ Tạm dừng';
  stepForward(true);
}

// ==================== NAVIGATION & EVENTS ====================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'edit') {
    stopCamera(true);
    refreshEditTab();
    setTimeout(() => editCube && editCube.resize(), 40);
  } else if (tab === 'solve') {
    stopCamera(true);
    setTimeout(() => solverCube && solverCube.resize(), 40);
  } else {
    setTimeout(() => scanCube && scanCube.resize(), 40);
  }
}

document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
document.getElementById('btnStartCamBig').addEventListener('click', startCamera);
document.getElementById('btnShoot').addEventListener('click', () => {
  if (!isCamOn) { startCamera(); return; }
  if (waitingForNewCenter || isGuidingTurn) { waitingForNewCenter = false; isGuidingTurn = false; document.getElementById('turnArrowOverlay').classList.remove('show'); }
  if (!lastDetection || liveColors.some(c => !c)) { showToast('Chưa thấy khối Rubik — đưa một mặt vào camera'); return; }
  liveColors[4] = SCAN_ORDER[currentStep].face;
  autoCaptureCurrentFace();
});
document.getElementById('btnToggleCam').addEventListener('click', () => isCamOn ? stopCamera(true) : startCamera());
document.getElementById('btnFlipCam').addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

document.getElementById('btnReset').addEventListener('click', () => {
  stopPlay();
  for (const f of COLOR_KEYS) { scannedFaces[f] = Array(9).fill(null); scannedConf[f] = Array(9).fill(99); }
  calibratedLab = {}; calibratedSet.clear();
  currentStep = 0; waitingForNewCenter = false; isGuidingTurn = false;
  document.getElementById('turnArrowOverlay').classList.remove('show');
  resetStreaks();
  renderFaceDots();
  scanCube.setActiveFace('F');
  scanCube.setTargetRot(SCAN_ORDER[0].rx, SCAN_ORDER[0].ry);
  document.getElementById('scanStatusPill').textContent = SCAN_ORDER[0].hint;
  syncScanCube3D();
  switchTab('scan');
  showToast('Đã làm mới');
});

document.getElementById('btnTest').addEventListener('click', () => {
  const c = makeSolved();
  const pool = ["U","U'","U2","D","D'","F","F'","B","B'","L","L'","R","R'"];
  for (let i = 0; i < 20; i++) applyMove(c, pool[Math.floor(Math.random() * pool.length)]);
  for (const f of COLOR_KEYS) {
    const off = FACE_OFFSET[f];
    scannedFaces[f] = c.slice(off, off + 9);
    scannedConf[f] = Array(9).fill(99);
  }
  renderFaceDots();
  syncScanCube3D();
  startKociembaSolve(c);
});

document.getElementById('btnBackScan').addEventListener('click', () => switchTab('scan'));
document.getElementById('btnRunSolve').addEventListener('click', () => {
  const s = getState54();
  const val = validateCube54(s);
  if (!val.ok) { refreshEditTab(); showToast(val.msg); return; }
  startKociembaSolve(s);
});

document.getElementById('btnNextMove').addEventListener('click', () => { stopPlay(); stepForward(false); });
document.getElementById('btnPrevMove').addEventListener('click', stepBackward);
document.getElementById('btnPlayPause').addEventListener('click', togglePlay);
document.querySelectorAll('.sp-btn').forEach(b => b.addEventListener('click', () => {
  moveAnimMs = parseInt(b.dataset.ms, 10);
  document.querySelectorAll('.sp-btn').forEach(x => x.classList.toggle('active', x === b));
}));

// ==================== INIT ====================
window.addEventListener('DOMContentLoaded', () => {
  initScanGrid();
  initPalette();
  initWorker();

  scanCube = createRubik3D('scanCanvas', { showActiveBorder: true });
  scanCube.setActiveFace('F');
  scanCube.setTargetRot(SCAN_ORDER[0].rx, SCAN_ORDER[0].ry);

  editCube = createRubik3D('editCanvas', {
    onStickerTap: (idx54) => {
      const faceIdx = Math.floor(idx54 / 9);
      const localIdx = idx54 % 9;
      if (localIdx === 4) { showToast('Ô tâm cố định'); return; }
      const f = COLOR_KEYS[faceIdx];
      scannedFaces[f][localIdx] = selectedEditColor;
      scannedConf[f][localIdx] = 99;
      refreshEditTab();
      renderFaceDots();
    }
  });

  solverCube = createRubik3D('solverCanvas', {});

  renderFaceDots();
  syncScanCube3D();
});
</script>
</body>
