<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hội Làng Đoán Ca Dao Tục Ngữ 3D - Chị Lucie & Em Lucas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#f7c948; --gold2:#e0a526; --red:#c81d25; --pink:#f472b6; --blue:#3b82f6; --pic:min(29vh,270px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Baloo 2',system-ui,sans-serif; color:#fff;
    background:radial-gradient(circle at 50% 30%,#2b1d5c 0,#0b1430 70%); }
  #c3d { position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible { outline:4px solid #fff59d; outline-offset:3px; }
  .screen { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:2vh 2vw; }
  .screen.show { display:flex; }

  /* ---------- Màn hình mở đầu ---------- */
  #scrStart { flex-direction:column; gap:2.2vh; }
  .ribbon { display:inline-block; background:linear-gradient(#e63946,#a4161a); color:#ffe8a3; font-weight:800; letter-spacing:2px;
    padding:2px 26px; border-radius:6px; font-size:clamp(14px,1.6vw,20px); box-shadow:0 4px 0 #6a040f; }
  .title { margin:6px 0 0; line-height:1.02; font-weight:800; font-size:clamp(32px,5.6vw,76px); text-align:center;
    color:#ffe066; text-shadow:0 4px 0 #9a3412, 0 8px 22px rgba(0,0,0,.6); }
  .title span { color:#fff; }
  .subtitle { display:inline-block; padding:0 22px; border-radius:999px; background:rgba(40,10,60,.72); margin:6px 0 0; text-align:center; font-size:clamp(17px,2.2vw,30px); font-weight:700; color:#ffd6e8; text-shadow:0 2px 8px #000; }
  .title-wrap { text-align:center; }
  .modes { display:flex; gap:clamp(10px,1.8vw,26px); flex-wrap:wrap; justify-content:center; }
  .mode { width:clamp(200px,25vw,320px); border:4px solid var(--gold); border-radius:26px; padding:16px 14px 18px; color:#fff;
    display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 10px 0 rgba(0,0,0,.35), 0 0 30px rgba(247,201,72,.25);
    transition:transform .2s, box-shadow .2s; }
  .mode:hover, .mode:focus-visible { transform:translateY(-8px) scale(1.03); box-shadow:0 16px 0 rgba(0,0,0,.35), 0 0 46px rgba(247,201,72,.6); }
  .m-lucas { background:linear-gradient(160deg,#60a5fa,#1d4ed8 70%); }
  .m-lucie { background:linear-gradient(160deg,#f9a8d4,#db2777 70%); }
  .m-both  { background:linear-gradient(160deg,#fcd34d,#ea580c 70%); }
  .portraits { display:flex; gap:8px; }
  .portrait { width:clamp(86px,9vw,124px); aspect-ratio:1; border-radius:50%; overflow:hidden; border:4px solid #fff3c4;
    background:linear-gradient(110deg,#ffffff33 30%,#ffffff66 50%,#ffffff33 70%); background-size:200% 100%; animation:shimmer 1.4s linear infinite; }
  .m-both .portrait { width:clamp(70px,7vw,100px); }
  .portrait img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .5s; }
  .portrait img.ok { opacity:1; }
  .mode-name { font-size:clamp(20px,2.2vw,30px); font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.3); line-height:1.1; }
  .mode-sub { font-size:clamp(14px,1.35vw,18px); font-weight:700; line-height:1.25; opacity:.97; }
  .mode-tag { margin-top:4px; font-size:13px; font-weight:800; background:#fff; color:#7c2d12; border-radius:999px; padding:1px 12px; }
  .hint { margin:0; font-size:clamp(13px,1.3vw,17px); color:#fde68a; text-shadow:0 2px 6px #000; text-align:center; }

  /* ---------- Màn chơi ---------- */
  .panel { width:min(860px,96vw); max-height:96vh; overflow:auto; padding:12px 18px 16px; border-radius:26px;
    background:rgba(24,12,46,.62); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    border:2px solid rgba(247,201,72,.4); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .hud { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .hbtn { border:0; border-radius:999px; padding:4px 16px; font-weight:800; font-size:16px; color:#7c2d12; background:#fde68a; box-shadow:0 4px 0 #b45309; }
  .turn { font-weight:800; font-size:clamp(17px,2vw,24px); padding:2px 18px; border-radius:999px; box-shadow:0 4px 0 rgba(0,0,0,.3); }
  .t-lucie { background:linear-gradient(#f9a8d4,#ec4899); }
  .t-lucas { background:linear-gradient(#93c5fd,#2563eb); }
  .scores { display:flex; gap:8px; }
  .chip { font-weight:700; font-size:15px; padding:2px 12px; border-radius:999px; background:rgba(255,255,255,.14); border:2px solid transparent; }
  .chip b { font-size:19px; color:#ffe066; }
  .chip.on { border-color:#ffe066; background:rgba(255,224,102,.2); }
  .progress { position:relative; height:16px; margin:10px 0 18px; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; }
  #progBar { height:100%; width:0; background:linear-gradient(90deg,#fde047,#f97316); transition:width .5s; }
  #progText { position:absolute; inset:0; text-align:center; font-size:13px; line-height:16px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000; }
  .frame { position:relative; padding:20px 14px 10px; border-radius:20px; background:linear-gradient(#4a230f,#2c1408);
    border:6px solid var(--gold); box-shadow:0 0 0 3px #8a5a12, inset 0 0 0 3px #8a5a12, 0 0 40px rgba(247,201,72,.35); }
  .frame-title { position:absolute; top:-17px; left:50%; transform:translateX(-50%); white-space:nowrap; font-weight:800; letter-spacing:1px;
    font-size:clamp(13px,1.4vw,17px); color:#6b2b0a; padding:1px 20px; border-radius:999px; background:linear-gradient(#ffe38a,#e0a526); box-shadow:0 3px 0 #8a5a12; }
  .pics { display:flex; gap:16px; justify-content:center; }
  .pic { flex:0 1 var(--pic); margin:0; }
  .imgbox { position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden; border:4px solid #f7d774; background:#2a1408;
    cursor:zoom-in; transition:transform .3s, box-shadow .3s; }
  .imgbox:hover { transform:scale(1.05); box-shadow:0 0 26px rgba(255,224,102,.7); z-index:2; }
  .imgbox img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .5s; }
  .imgbox.ready img { opacity:1; }
  .skel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:#f7d774; font-size:14px; font-weight:700; background:linear-gradient(110deg,#3a2414 30%,#6b4524 50%,#3a2414 70%);
    background-size:200% 100%; animation:shimmer 1.4s linear infinite; }
  .imgbox.ready .skel { display:none; }
  .spin { width:46px; height:46px; border-radius:50%; border:5px solid rgba(247,215,116,.25); border-top-color:#f7d774; animation:spin 1s linear infinite; }
  .zoomhint { position:absolute; right:6px; bottom:6px; font-size:12px; font-weight:800; background:rgba(0,0,0,.55); color:#ffe066; padding:0 8px; border-radius:999px; opacity:0; transition:opacity .3s; }
  .imgbox.ready:hover .zoomhint { opacity:1; }
  .pic figcaption { text-align:center; margin-top:5px; font-weight:800; color:#ffe9a8; font-size:clamp(14px,1.6vw,19px); line-height:1.2; }
  .question { margin:14px 0 12px; text-align:center; font-weight:800; font-size:clamp(20px,2.7vw,34px); line-height:1.35; text-shadow:0 2px 0 #7c2d12, 0 4px 14px rgba(0,0,0,.5); }
  .blank { display:inline-block; min-width:2.6em; padding:0 .4em; margin:0 .15em; border-radius:10px; background:#fde047; color:#7c2d12; text-shadow:none; animation:pulse 1.3s ease-in-out infinite; }
  .blank.filled { background:#34d399; color:#064e3b; animation:pop .5s; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:14px; perspective:700px; }
  .ans { position:relative; display:flex; align-items:center; gap:12px; text-align:left; padding:10px 16px; border-radius:18px;
    background:linear-gradient(180deg,#fffaf0,#ffe3a3); color:#5a2a0c; font-weight:800; font-size:clamp(18px,2.3vw,28px);
    border:3px solid var(--gold); box-shadow:0 8px 0 #b7791f, 0 14px 22px rgba(0,0,0,.35); transform:rotateX(10deg); transition:transform .18s, box-shadow .18s, opacity .3s; }
  .ans:hover:not(:disabled), .ans:focus-visible { transform:rotateX(0) translateY(-6px) scale(1.03); box-shadow:0 14px 0 #b7791f, 0 20px 28px rgba(0,0,0,.4); }
  .ans:disabled { cursor:default; }
  .letter { flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:22px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  .l0 { background:#ef4444; } .l1 { background:#3b82f6; } .l2 { background:#10b981; } .l3 { background:#a855f7; }
  .ans.correct { background:linear-gradient(#d1fae5,#6ee7b7); border-color:#059669; box-shadow:0 8px 0 #047857, 0 0 26px #34d399; animation:pop .5s; transform:rotateX(0); }
  .ans.wrong { background:linear-gradient(#fee2e2,#fca5a5); border-color:#dc2626; box-shadow:0 8px 0 #991b1b; animation:shake .5s; }
  .ans.dim { opacity:.55; }
  .ans.gone { opacity:.18; filter:grayscale(1); transform:rotateX(10deg) scale(.94); }
  .tools { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .tbtn { border:0; border-radius:999px; padding:7px 22px; font-weight:800; font-size:clamp(15px,1.6vw,20px); color:#fff; display:inline-flex; align-items:center; gap:8px; }
  .tbtn svg { width:22px; height:22px; flex:none; }
  .tbtn:disabled { opacity:.45; cursor:default; }
  .read { background:linear-gradient(#38bdf8,#0369a1); box-shadow:0 5px 0 #075985; }
  .help { background:linear-gradient(#fb7185,#be123c); box-shadow:0 5px 0 #881337; }
  .help b { background:#fff; color:#be123c; border-radius:999px; padding:0 9px; }
  .next { background:linear-gradient(#4ade80,#15803d); box-shadow:0 5px 0 #14532d; }

  /* ---------- Hộp thoại ---------- */
  .modal { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:3vh 3vw; background:rgba(5,5,25,.55); }
  .modal.show { display:flex; }
  .card { width:min(660px,94vw); max-height:92vh; overflow:auto; border-radius:26px; padding:22px 26px; text-align:center; color:#3b1d0b;
    background:linear-gradient(#fffdf3,#ffefc2); border:6px solid var(--gold); box-shadow:0 0 0 3px #8a5a12, 0 30px 70px rgba(0,0,0,.6); animation:pop .4s; }
  .fb-title { font-size:clamp(28px,3.6vw,44px); font-weight:800; line-height:1.1; }
  .fb-title.ok { color:#15803d; } .fb-title.no { color:#c2410c; }
  .fb-who { font-weight:700; font-size:18px; color:#7c2d12; margin-top:2px; }
  .fb-full { margin:12px 0; padding:10px 14px; border-radius:16px; background:#7c2d12; color:#ffe066; font-weight:800; font-size:clamp(19px,2.3vw,27px); line-height:1.35; }
  .fb-mean { font-size:clamp(17px,1.9vw,22px); line-height:1.45; text-align:left; }
  .fb-mean b { color:#b91c1c; }
  .fb-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  #lightbox figure { margin:0; text-align:center; }
  #lightbox img { max-width:92vw; max-height:80vh; border-radius:18px; border:8px solid var(--gold); box-shadow:0 0 0 4px #8a5a12, 0 30px 80px #000; animation:pop .35s; }
  #lightbox figcaption { margin-top:10px; font-size:clamp(20px,2.6vw,32px); font-weight:800; color:#ffe066; text-shadow:0 2px 8px #000; }
  .lb-close { font-size:14px; color:#fde68a; opacity:.85; }
  .endcard h2 { margin:0; font-size:clamp(30px,4vw,48px); color:#b91c1c; line-height:1.1; }
  .res { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .resbox { flex:1 1 220px; border-radius:20px; padding:12px; color:#fff; }
  .resbox.lucie { background:linear-gradient(#f9a8d4,#db2777); } .resbox.lucas { background:linear-gradient(#93c5fd,#1d4ed8); }
  .resbox .nm { font-size:24px; font-weight:800; } .resbox .pt { font-size:40px; font-weight:800; color:#fff59d; line-height:1; }
  .stars { display:flex; justify-content:center; gap:4px; margin:6px 0; } .stars svg { width:44px; height:44px; }
  .endmsg { font-size:20px; font-weight:700; margin-top:10px; }
  #toast { position:fixed; left:50%; top:16px; transform:translate(-50%,-140%); z-index:80; background:#fff7d6; color:#7c2d12; font-weight:800;
    padding:8px 22px; border-radius:999px; border:3px solid var(--gold); box-shadow:0 8px 24px rgba(0,0,0,.4); transition:transform .35s; max-width:92vw; text-align:center; }
  #toast.show { transform:translate(-50%,0); }
  #btnMute { position:fixed; right:14px; bottom:14px; z-index:40; width:52px; height:52px; border-radius:50%; border:3px solid var(--gold);
    background:rgba(30,15,60,.8); color:#ffe066; display:grid; place-items:center; }
  #btnMute svg { width:26px; height:26px; }

  @keyframes shimmer { to { background-position:-200% 0; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  @keyframes pop { 0% { transform:scale(.6); opacity:0; } 70% { transform:scale(1.06); opacity:1; } 100% { transform:scale(1); } }
  @keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
  @media (max-width:640px) { .answers { gap:10px; } .ans { padding:8px 10px; } .letter { width:34px; height:34px; font-size:18px; } :root { --pic:42vw; } }
  @media (max-height:640px) { :root { --pic:min(24vh,220px); } .question { margin:8px 0; } }
</style>

<body>
<canvas id="c3d"></canvas>

<!-- MÀN HÌNH MỞ ĐẦU -->
<section id="scrStart" class="screen show">
  <div class="title-wrap">
    <div class="ribbon">SÂN ĐÌNH MỞ HỘI</div>
    <h1 class="title">HỘI LÀNG ĐOÁN<br><span>CA DAO TỤC NGỮ</span></h1>
    <p class="subtitle">cùng Chị Lucie &amp; Em Lucas</p>
  </div>
  <div class="modes">
    <button class="mode m-lucas" data-mode="lucas">
      <div class="portraits"><div class="portrait" data-portrait="lucas"></div></div>
      <div class="mode-name">EM LUCAS</div>
      <div class="mode-sub">Lớp <span data-hs="lucas.lop">1A5</span> · 25 câu đồng dao &amp; tục ngữ ngắn</div>
      <div class="mode-tag" data-hs="lucas.ten">Nguyễn Ngọc Tường Minh</div>
    </button>
    <button class="mode m-lucie" data-mode="lucie">
      <div class="portraits"><div class="portrait" data-portrait="lucie"></div></div>
      <div class="mode-name">CHỊ LUCIE</div>
      <div class="mode-sub">Lớp <span data-hs="lucie.lop">3A6</span> · 25 câu ca dao lục bát &amp; tục ngữ</div>
      <div class="mode-tag" data-hs="lucie.ten">Nguyễn Ngọc Tường San</div>
    </button>
    <button class="mode m-both" data-mode="both">
      <div class="portraits"><div class="portrait" data-portrait="lucie"></div><div class="portrait" data-portrait="lucas"></div></div>
      <div class="mode-name">HAI CHỊ EM CÙNG CHƠI</div>
      <div class="mode-sub">50 câu · lần lượt đổi lượt Chị Lucie và Em Lucas</div>
      <div class="mode-tag"><span data-hs="truong">Trường TH&amp;THCS Chu Văn An</span></div>
    </button>
  </div>
  <button class="mode" id="btnTiep" style="display:none;width:auto;flex-direction:row;padding:10px 26px;background:linear-gradient(160deg,#4ade80,#15803d)"><div class="mode-name" id="tiepTen">CHƠI TIẾP</div></button>
  <p class="hint">Bấm vào tranh để phóng to · Bấm "Đọc câu hỏi" để nghe giọng đọc · Bàn phím: 1 2 3 4 để chọn đáp án</p>
</section>

<!-- MÀN CHƠI -->
<section id="scrGame" class="screen">
  <div class="panel">
    <div class="hud">
      <button class="hbtn" id="btnHome">Về sân đình</button>
      <div class="turn t-lucas" id="turnBadge">Lượt của Em Lucas</div>
      <div class="scores" id="scores"></div>
    </div>
    <div class="progress"><div id="progBar"></div><span id="progText">Câu 1/25</span></div>
    <div class="frame">
      <div class="frame-title">KHUNG TRANH PHÉP THUẬT</div>
      <div class="pics">
        <figure class="pic" data-k="1"><div class="imgbox"><img alt=""><div class="skel"><div class="spin"></div><span>Đang vẽ tranh...</span></div><div class="zoomhint">Phóng to</div></div><figcaption></figcaption></figure>
        <figure class="pic" data-k="2"><div class="imgbox"><img alt=""><div class="skel"><div class="spin"></div><span>Đang vẽ tranh...</span></div><div class="zoomhint">Phóng to</div></div><figcaption></figcaption></figure>
      </div>
    </div>
    <div class="question" id="qText"></div>
    <div class="answers" id="answers"></div>
    <div class="tools">
      <button class="tbtn read" id="btnRead"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>Đọc câu hỏi &amp; Giải nghĩa</button>
      <button class="tbtn help" id="btnHelp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg>Phao Trợ Giúp Hai Chị Em <b id="helpLeft">3</b></button>
    </div>
  </div>
</section>

<!-- MÀN KẾT THÚC -->
<section id="scrEnd" class="screen">
  <div class="card endcard">
    <h2>HỘI LÀNG TỔNG KẾT</h2>
    <div id="endBody"></div>
    <div class="fb-btns"><button class="tbtn next" id="btnAgain">Chơi lại</button><button class="tbtn read" id="btnBack">Về sân đình</button></div>
  </div>
</section>

<!-- BẢNG GIẢI NGHĨA -->
<div id="feedback" class="modal">
  <div class="card">
    <div class="fb-title" id="fbTitle"></div>
    <div class="fb-who" id="fbWho"></div>
    <div class="fb-full" id="fbFull"></div>
    <div class="fb-mean"><b>Bài học:</b> <span id="fbMean"></span></div>
    <div class="fb-btns">
      <button class="tbtn read" id="fbRead">Nghe giải nghĩa</button>
      <button class="tbtn next" id="fbNext">Câu tiếp theo</button>
    </div>
  </div>
</div>

<!-- PHÓNG TO TRANH -->
<div id="lightbox" class="modal"><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption><div class="lb-close">Bấm vào bất kỳ đâu để đóng</div></figure></div>

<button id="btnMute" aria-label="Tắt hoặc bật âm thanh"></button>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";
/* =====================================================================
   DỮ LIỆU 50 CÂU HỎI
   Mỗi dòng: [câu khuyết, đáp án đúng, "3 đáp án sai", tranh 1, chú thích 1, tranh 2, chú thích 2, ý nghĩa]
   ===================================================================== */

   ===================================================================== */
const Sound = (() => {
  let ctx=null, master=null, muted=false, noiseBuf=null;
  function ensure(){
    if (!ctx) { const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=muted?0:0.9; master.connect(ctx.destination); }
    if (ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function noise(){ if(!noiseBuf){ noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.4,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
  function drum(t,str=1){ // tiếng "tùng"
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine";
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(46,t+0.35);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(str,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.8);
    const n=ctx.createBufferSource(), f=ctx.createBiquadFilter(), ng=ctx.createGain(); n.buffer=noise(); f.type="lowpass"; f.frequency.value=520;
    ng.gain.setValueAtTime(0.55*str,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(t); n.stop(t+0.2);
  }
  function rim(t){ // tiếng "cắc" gõ tang trống
    const o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain(); o.type="square"; o.frequency.value=1100; f.type="bandpass"; f.frequency.value=1900;
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+0.08);
  }
  function tone(t,freq,dur,type="triangle",vol=0.22){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
  }
  const run = fn => { try { if (ensure()) fn(ctx.currentTime); } catch(e) {} };
  return {
    init: () => run(()=>{}),
    get muted(){ return muted; },
    toggle(){ muted=!muted; if(master) master.gain.value=muted?0:0.9; if(muted && window.speechSynthesis) speechSynthesis.cancel(); return muted; },
    click: () => run(t=>tone(t,700,0.08,"sine",0.12)),
    drumHit: () => run(t=>{ drum(t,1); drum(t+0.25,0.7); }),
    correct: () => run(t=>{ drum(t,1); drum(t+0.22,0.8); rim(t+0.42); drum(t+0.55,1.1); [523,587,659,784,880,1047].forEach((f,i)=>tone(t+0.78+i*0.09,f,0.45)); }),
    wrong: () => run(t=>{ tone(t,392,0.35,"sine",0.18); tone(t+0.25,311,0.55,"sine",0.18); }),
    help: () => run(t=>[880,1175,1568].forEach((f,i)=>tone(t+i*0.08,f,0.3,"sine",0.12))),
    fanfare: () => run(t=>{ [0,0.2,0.4,0.6].forEach((d,i)=>drum(t+d,i===3?1.2:0.8)); rim(t+0.75); [523,659,784,1047,784,1047].forEach((f,i)=>tone(t+0.9+i*0.16,f,0.5)); })
  };
})();

const Voice = {
  v:null,
  pick(){ try { this.v = speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang)) || null; } catch(e) {} },
  say(text){
    if (!("speechSynthesis" in window)) { toast("Trình duyệt này chưa có giọng đọc"); return; }
    if (Sound.muted) { toast("Âm thanh đang tắt, bấm nút loa ở góc phải để bật"); return; }
    speechSynthesis.cancel();
    if (!this.v) this.pick();
    if (!this.v && !this.warned) { this.warned = true; toast("Máy này chưa cài giọng đọc tiếng Việt nên đọc có thể chưa chuẩn. Trên TV Android/điện thoại thường đã có sẵn."); }
    setTimeout(()=>{ const u=new SpeechSynthesisUtterance(text); u.lang="vi-VN"; if(!this.v) this.pick(); if(this.v) u.voice=this.v; u.rate=0.85; u.pitch=1.05; speechSynthesis.speak(u); }, 80);
  },
  stop(){ try { speechSynthesis.cancel(); } catch(e) {} }
};

function svgFallback(caption, k){
  const c1 = k===1 ? "#fbbf24" : "#f472b6", c2 = k===1 ? "#f97316" : "#8b5cf6";
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="512" height="512" fill="url(#g)"/><circle cx="400" cy="110" r="64" fill="#ffffff55"/><circle cx="110" cy="420" r="90" fill="#ffffff33"/><text x="256" y="272" font-family="Baloo 2, Arial, sans-serif" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">${esc(caption)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
}
function loadImg(url, ms){
  return new Promise((res, rej) => {
    const im = new Image(); let done = false;
    const tm = setTimeout(() => { if (!done) { done = true; im.src = ""; rej("timeout"); } }, ms);
    im.onload = () => { if (done) return; done = true; clearTimeout(tm); im.naturalWidth > 10 ? res(url) : rej("empty"); };
    im.onerror = () => { if (done) return; done = true; clearTimeout(tm); rej("error"); };
    im.src = url;
  });
}

const IQ = { active:0, max:3, list:[] };
function enqueue(task, prio){ return new Promise((res, rej) => { const it={task,res,rej}; prio ? IQ.list.unshift(it) : IQ.list.push(it); pump(); }); }
function pump(){ while (IQ.active < IQ.max && IQ.list.length) { const it = IQ.list.shift(); IQ.active++; it.task().then(it.res, it.rej).finally(() => { IQ.active--; pump(); }); } }
const picCache = new Map();
function getImg(key, prompt, seed, caption, k, prio){
  if (picCache.has(key)) return picCache.get(key);
  // 1) tranh đã được máy chủ GitHub vẽ sẵn (hiện ngay)  2) vẽ trực tiếp bằng Pollinations  3) ảnh dự phòng
  const p = loadImg("anh/" + key + ".webp", 8000)
    .catch(() => enqueue(() => loadImg(pollUrl(prompt, seed), 30000), prio))
    .catch(() => enqueue(() => loadImg(pollUrl(prompt, seed + 5000), 22000), prio))
    .catch(() => loadImg("https://loremflickr.com/512/512/" + keywords(prompt) + "?lock=" + seed, 12000))
    .catch(() => loadImg("https://picsum.photos/seed/cadao" + seed + "/512/512", 10000))
    .catch(() => svgFallback(caption, k));
  picCache.set(key, p);
  return p;
}

function animChar(c, t, dt, rdt){

  sad(who){ if (has3D()) chars[who].sad = 1.6; },
  wave(who){ if (has3D()) chars[who].dance = 1.2; },
  finale(){ if (!has3D()) return; hitDrum(); burstConfetti(0, 4.6, -1, 220); for (let i=0;i<8;i++) setTimeout(() => firework((Math.random()-.5)*22, 8+Math.random()*5, -6-Math.random()*8), i*380); chars.lucie.dance = 2.2; chars.lucas.dance = 2.2; }
};
function animate(){
  requestAnimationFrame(animate);
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05), rdt = Math.min(raw, 0.5), t = clock.elapsedTime;
  const start = camMode === "start";
  const tp = start ? { x:Math.sin(t*0.15)*5, y:6.5+Math.sin(t*0.2)*0.6, z:20 } : { x:Math.sin(t*0.25)*0.4, y:4.4, z:13.5 };
  const tl = start ? { x:0, y:3, z:-6 } : { x:0, y:2.6, z:-1 };
  const k = Math.min(1, dt*1.8);
  camera.position.x += (tp.x - camera.position.x)*k; camera.position.y += (tp.y - camera.position.y)*k; camera.position.z += (tp.z - camera.position.z)*k;
  curLook.x += (tl.x - curLook.x)*k; curLook.y += (tl.y - curLook.y)*k; curLook.z += (tl.z - curLook.z)*k;
  camera.lookAt(curLook.x, curLook.y, curLook.z);
  lanterns.forEach(l => { l.position.y = l.userData.y + Math.sin(t*0.8 + l.userData.p)*0.35; l.rotation.y += dt*0.3; });
  if (water) water.material.emissiveIntensity = 0.55 + Math.sin(t*1.5)*0.15;
  const d = drum.userData;
  if (d.hit > 0) { d.hit -= dt; d.barrel.scale.setScalar(1 + Math.sin(d.hit*40)*0.06*Math.max(0, d.hit)); } else d.barrel.scale.setScalar(1);
  for (let i=waves.length-1;i>=0;i--) { const w = waves[i]; w.userData.life -= dt; const p = 1 - w.userData.life/0.9; w.scale.setScalar(1 + p*3.5); w.material.opacity = Math.max(0, 0.9*(1-p));
    if (w.userData.life <= 0) { scene.remove(w); w.geometry.dispose(); w.material.dispose(); waves.splice(i,1); } }
  const sp = sparkles.geometry.attributes.position;
  for (let i=0;i<sp.count;i++) { let y = sp.getY(i) + dt*(0.4 + (i%5)*0.12); if (y > 14) y = 0; sp.setY(i, y); }
  sp.needsUpdate = true;
  for (let i=confetti.length-1;i>=0;i--) { const m = confetti[i], u = m.userData;
    u.v.y -= 7*dt; u.v.multiplyScalar(0.985); m.position.addScaledVector(u.v, dt);
    if (m.position.y < 0.05) { m.position.y = 0.05; u.v.set(0,0,0); } else { m.rotation.x += u.r.x*dt; m.rotation.y += u.r.y*dt; m.rotation.z += u.r.z*dt; }
    u.life -= dt; if (u.life < 1) m.material.opacity = Math.max(0, u.life);
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); confetti.splice(i,1); } }
  for (let i=fireworks.length-1;i>=0;i--) { const p = fireworks[i], u = p.userData, a = p.geometry.attributes.position;
    for (let j=0;j<u.vel.length;j++) { const v = u.vel[j]; v.multiplyScalar(0.97); v.y -= 2.5*dt; a.setXYZ(j, a.getX(j)+v.x*dt, a.getY(j)+v.y*dt, a.getZ(j)+v.z*dt); }
    a.needsUpdate = true; u.life -= dt; p.material.opacity = Math.max(0, u.life/2.2);
    if (u.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); fireworks.splice(i,1); } }
  animChar(chars.lucie, t, dt, rdt); animChar(chars.lucas, t, dt, rdt);
  if (start && t > nextFw) { firework((Math.random()-.5)*26, 9+Math.random()*4, -10-Math.random()*6); nextFw = t + 1.1 + Math.random(); }
  renderer.render(scene, camera);
}
addEventListener("resize", () => { if (!has3D()) return; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); placeChars(); });

/* =====================================================================
   LUẬT CHƠI
   ===================================================================== */
const S = { mode:null, list:[], idx:0, q:null, answered:false, usedHelp:false, players:{}, active:null };
let picToken = 0;
const newPlayer = () => ({ score:0, right:0, total:0, help:3 });
function showScreen(id){ $$(".screen").forEach(s => s.classList.toggle("show", s.id === id)); }
function buildList(mode){
  const pick = (lv, kid, n) => { let da = []; try { da = JSON.parse(localStorage.getItem("hlcd_daChoi_" + kid) || "[]"); } catch (e) {}
    const all = QUESTIONS.filter(q => q.level === lv); let moi = shuffle(all.filter(q => !da.includes(q.id)));
    if (moi.length < n) { da = []; moi = shuffle(all); }
    const ds = moi.slice(0, n); try { localStorage.setItem("hlcd_daChoi_" + kid, JSON.stringify(da.concat(ds.map(q => q.id)))); } catch (e) {} return ds; };
  if (mode === "lucas") return pick(1, "lucas", 20);
  if (mode === "lucie") return pick(3, "lucie", 20);
  const A = pick(1, "lucas", 10), B = pick(3, "lucie", 10);
  const out = []; for (let i=0;i<10;i++) out.push(A[i], B[i]); return out;   // em Lucas đi trước, rồi đến lượt chị Lucie
}
function startGame(mode){
  const dang = docVan(); if (dang && dang.mode === mode) return choiTiep();   // ván đang dở cùng chế độ: tự chơi tiếp
  Sound.init(); Sound.drumHit();
  S.mode = mode; S.list = buildList(mode); S.idx = 0; S.players = {};
  if (mode !== "lucie") S.players.lucas = newPlayer();
  if (mode !== "lucas") S.players.lucie = newPlayer();
  camMode = "game"; showScreen("scrGame"); showQuestion();
}
function goHome(){ Voice.stop(); $("#feedback").classList.remove("show"); S.active = null; camMode = "start"; showScreen("scrStart"); hienChoiTiep(); }
// Lưu ván đang chơi để thoát ra rồi vào lại vẫn chơi tiếp
const KHOA_VAN = "hoiLang_dangChoi";
const TEN_CHE_DO = { lucas:"Em Lucas", lucie:"Chị Lucie", both:"Hai chị em" };
function luuVan(){ try { localStorage.setItem(KHOA_VAN, JSON.stringify({ mode:S.mode, ids:S.list.map(q => q.id), idx:S.idx, players:S.players })); } catch(e) {} }
function docVan(){ try { const o = JSON.parse(localStorage.getItem(KHOA_VAN) || "null"); return o && o.ids && o.idx < o.ids.length ? o : null; } catch(e) { return null; } }
function hienChoiTiep(){
  const o = docVan(), b = $("#btnTiep"); if (!b) return;
  if (!o) { b.style.display = "none"; return; }
  $("#tiepTen").textContent = `CHƠI TIẾP · ${TEN_CHE_DO[o.mode] || ""} · câu ${o.idx + 1}/${o.ids.length}`;
  b.style.display = "flex";
}
function choiTiep(){
  const o = docVan(); if (!o) return;
  Sound.init(); Sound.drumHit();
  S.mode = o.mode; S.list = o.ids.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean); S.idx = Math.min(o.idx, S.list.length - 1); S.players = o.players;
  camMode = "game"; showScreen("scrGame"); showQuestion();
}
function fullText(q){ return q.questionText.includes("[...]") ? q.questionText.replace("[...]", q.correctAnswer) : q.questionText + " Đó là " + q.correctAnswer + "."; }
function renderQuestion(q, filled){
  const el = $("#qText"); el.innerHTML = "";
  const addText = t => t.split(" / ").forEach((line, i) => { if (i) el.appendChild(document.createElement("br")); el.appendChild(document.createTextNode(line)); });
  const blank = () => { const s = document.createElement("span"); s.className = "blank" + (filled ? " filled" : ""); s.textContent = filled ? q.correctAnswer : "?"; return s; };
  const parts = q.questionText.split("[...]");
  if (parts.length === 1) { addText(q.questionText); el.appendChild(document.createElement("br")); el.appendChild(document.createTextNode("Đó là: ")); el.appendChild(blank()); }
  else { addText(parts[0]); el.appendChild(blank()); addText(parts[1]); }
}
function renderScores(){
  $("#scores").innerHTML = Object.keys(S.players).map(w => `<div class="chip ${w===S.active?"on":""}">${NAME[w]}: <b>${S.players[w].score}</b></div>`).join("");
}
function showPics(q){
  const token = ++picToken;
  $$(".pic").forEach(fig => {
    const k = +fig.dataset.k, box = fig.querySelector(".imgbox"), img = box.querySelector("img"), cap = k===1 ? q.imgCaption1 : q.imgCaption2;
    box.classList.remove("ready"); img.removeAttribute("src"); img.alt = cap; fig.querySelector("figcaption").textContent = cap;
    img.onerror = () => { if (token === picToken) img.src = svgFallback(cap, k); };
    img.onload = () => { if (token === picToken) box.classList.add("ready"); };
    getPic(q, k, true).then(url => { if (token === picToken) img.src = url; });
  });
}
function showQuestion(){
  const q = S.list[S.idx]; S.q = q; S.answered = false; S.usedHelp = false;
  luuVan();
  const who = q.level === 1 ? "lucas" : "lucie"; S.active = who;
  const P = S.players[who];
  const tb = $("#turnBadge"); tb.textContent = "Lượt của " + NAME[who]; tb.className = "turn t-" + who;
  renderScores();
  $("#progText").textContent = `Câu ${S.idx+1}/${S.list.length}`;
  $("#progBar").style.width = (S.idx / S.list.length * 100) + "%";
  renderQuestion(q, false);
  const box = $("#answers"); box.innerHTML = "";
  shuffle([q.correctAnswer, ...q.wrongAnswers]).forEach((o, i) => {
    const b = document.createElement("button"); b.className = "ans"; b.dataset.val = o;
    b.innerHTML = `<span class="letter l${i}">${"ABCD"[i]}</span><span class="txt"></span>`; b.querySelector(".txt").textContent = o;
    b.onclick = () => choose(b); box.appendChild(b);
  });
  $("#helpLeft").textContent = P.help; $("#btnHelp").disabled = P.help <= 0;
  showPics(q);
  preloadNextImages();
  setTimeout(() => { const f = $(".ans"); if (f && S.q === q) f.focus({ preventScroll:true }); }, 50);
  if (who === "lucas" && Voice.v && !Sound.muted) setTimeout(() => { if (S.q === q && !S.answered) readQuestion(); }, 800);
}
function readQuestion(){
  const q = S.q; if (!q) return;
  if (S.answered) { Voice.say(fullText(q).replace(/ \/ /g, ". ") + ". Bài học: " + q.meaning); return; }
  const text = q.questionText.replace("[...]", " gì nhỉ ").replace(/ \/ /g, ". ");
  const opts = $$(".ans:not(.gone)").map(b => b.querySelector(".letter").textContent + ": " + b.dataset.val).join(". ");
  Voice.say(text + ". Các đáp án là. " + opts);
}
function choose(btn){
  if (S.answered) return; S.answered = true; Voice.stop();
  const q = S.q, ok = btn.dataset.val === q.correctAnswer, P = S.players[S.active];
  P.total++;
  $$(".ans").forEach(b => { b.disabled = true; if (b.dataset.val === q.correctAnswer) b.classList.add("correct"); else if (b === btn) b.classList.add("wrong"); else if (!b.classList.contains("gone")) b.classList.add("dim"); });
  renderQuestion(q, true);
  if (ok) { P.right++; P.score += S.usedHelp ? 5 : 10; Sound.correct(); FX.celebrate(); }
  else { Sound.wrong(); FX.sad(S.active); }
  renderScores(); logResult(q, ok);
  setTimeout(() => { if (S.q === q && S.answered) showFeedback(ok); }, ok ? 1300 : 1100);
}
const PRAISE = ["ĐÚNG RỒI! GIỎI QUÁ!", "TUYỆT VỜI!", "CHÍNH XÁC!", "XUẤT SẮC!", "HAY QUÁ!"];
function showFeedback(ok){
  const q = S.q;
  const t = $("#fbTitle"); t.textContent = ok ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : "CHƯA ĐÚNG RỒI, CỐ LÊN NHÉ!"; t.className = "fb-title " + (ok ? "ok" : "no");
  $("#fbWho").textContent = ok ? `${NAME[S.active]} được cộng ${S.usedHelp ? 5 : 10} điểm` : `Đáp án đúng là "${q.correctAnswer}"`;
  $("#fbFull").innerHTML = esc(fullText(q)).replace(/ \/ /g, "<br>");
  $("#fbMean").textContent = q.meaning;
  $("#fbNext").textContent = S.idx + 1 >= S.list.length ? "Xem kết quả" : "Câu tiếp theo";
  $("#feedback").classList.add("show");
  setTimeout(() => $("#fbNext").focus({ preventScroll:true }), 60);
}
function nextQuestion(){
  Voice.stop(); Sound.click(); $("#feedback").classList.remove("show");
  S.idx++;
  if (S.idx >= S.list.length) endGame(); else showQuestion();
}
function useHelp(){
  if (S.answered || S.usedHelp) return;
  const P = S.players[S.active]; if (P.help <= 0) return;
  P.help--; S.usedHelp = true;
  shuffle($$(".ans").filter(b => b.dataset.val !== S.q.correctAnswer)).slice(0, 2).forEach(b => { b.classList.add("gone"); b.disabled = true; });
  $("#helpLeft").textContent = P.help; $("#btnHelp").disabled = true;
  Sound.help();
  const helper = S.active === "lucas" ? "lucie" : "lucas"; FX.wave(helper);
  toast(`${NAME[helper]} mách nhỏ: đã bỏ bớt 2 đáp án sai rồi nhé!`);
}
const starSVG = on => `<svg viewBox="0 0 24 24"><path d="M12 2l3 6.9 7.5.6-5.7 4.9 1.8 7.3L12 17.8 5.4 21.7l1.8-7.3L1.5 9.5 9 8.9z" fill="${on?"#facc15":"#ffffff55"}" stroke="#92400e" stroke-width="1"/></svg>`;
const starsOf = P => { const r = P.total ? P.right / P.total : 0; return r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0; };
function endGame(){
  S.active = null; camMode = "game";
  try { localStorage.removeItem(KHOA_VAN); } catch(e) {}
  const ws = Object.keys(S.players);
  $("#endBody").innerHTML = `<div class="res">` + ws.map(w => { const P = S.players[w], st = starsOf(P);
    return `<div class="resbox ${w}"><div class="nm">${NAME[w]}</div><div style="font-weight:700">${HS[w].ten} · Lớp ${HS[w].lop}</div><div class="pt">${P.score} điểm</div><div class="stars">${[0,1,2].map(i => starSVG(i < st)).join("")}</div><div>Đúng ${P.right}/${P.total} câu</div></div>`; }).join("") + `</div>` +
    `<div class="endmsg">${ws.length > 1 ? "Hai chị em đã cùng nhau học thêm thật nhiều câu ca dao, tục ngữ hay. Cả nhà khen cả hai!" : (starsOf(S.players[ws[0]]) >= 2 ? "Giỏi quá! Con đã thuộc rất nhiều câu ca dao, tục ngữ." : "Cố lên nhé! Chơi lại để thuộc thêm nhiều câu hay hơn nữa.")}</div>`;
  ws.forEach(w => saveProgress(w, S.players[w]));
  showScreen("scrEnd"); Sound.fanfare(); FX.finale();
  setTimeout(() => $("#btnAgain").focus({ preventScroll:true }), 80);
}
// Ghi vào nhật ký chung để trang "Bảng thành tích" của bố mẹ đọc được
function logResult(q, ok){ try { const k = "giaDinh_nhatKy", a = JSON.parse(localStorage.getItem(k) || "[]");
  a.push({ t:Date.now(), g:"cadao", c:S.active, s:"Tiếng Việt", q:q.questionText.slice(0,140), ok:!!ok }); if (a.length > 6000) a.splice(0, a.length - 6000); localStorage.setItem(k, JSON.stringify(a)); } catch(e) {} }
function saveProgress(w, P){ try { const k = "cadao_" + w, o = JSON.parse(localStorage.getItem(k) || "{}");
  o.luot = (o.luot || 0) + 1; if (starsOf(P) === 3) o.cup = (o.cup || 0) + 1; o.best = Math.max(o.best || 0, P.right); o.lanCuoi = Date.now(); localStorage.setItem(k, JSON.stringify(o)); } catch(e) {} }

/* =====================================================================
   NÚT BẤM, BÀN PHÍM, PHÓNG TO TRANH
   ===================================================================== */
const ICON_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3l2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>';
$("#btnMute").innerHTML = ICON_ON;
$("#btnMute").onclick = () => { const m = Sound.toggle(); $("#btnMute").innerHTML = m ? ICON_OFF : ICON_ON; toast(m ? "Đã tắt âm thanh" : "Đã bật âm thanh"); };
$$(".mode[data-mode]").forEach(b => b.onclick = () => startGame(b.dataset.mode));
$("#btnTiep").onclick = choiTiep;
hienChoiTiep();
$("#btnHome").onclick = goHome;
$("#btnRead").onclick = readQuestion;
$("#btnHelp").onclick = useHelp;
$("#fbNext").onclick = nextQuestion;
$("#fbRead").onclick = readQuestion;
$("#btnAgain").onclick = () => { try { localStorage.removeItem(KHOA_VAN); } catch(e) {} startGame(S.mode); };
$("#btnBack").onclick = goHome;
$$(".pic .imgbox").forEach(box => box.onclick = () => {
  const img = box.querySelector("img"); if (!img.getAttribute("src")) return;
  Sound.click(); $("#lbImg").src = img.src; $("#lbCap").textContent = img.alt; $("#lightbox").classList.add("show");
});
$("#lightbox").onclick = () => $("#lightbox").classList.remove("show");
document.addEventListener("keydown", e => {
  if ($("#lightbox").classList.contains("show")) { if (["Escape","Enter"," "].includes(e.key)) { e.preventDefault(); $("#lightbox").classList.remove("show"); } return; }
  if ($("#feedback").classList.contains("show")) { if (e.key === "Escape") { e.preventDefault(); nextQuestion(); } return; }
  if (!$("#scrGame").classList.contains("show") || S.answered) return;
  const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
  if (i >= 0 && e.key.length === 1) { const b = $$(".ans")[i]; if (b && !b.disabled) choose(b); }
});
document.addEventListener("pointerdown", () => Sound.init(), { once:true });

init3D();
loadPortraits();
