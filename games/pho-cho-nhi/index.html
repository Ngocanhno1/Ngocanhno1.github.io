<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phố Chợ Nhí Lucie & Lucas</title>
<meta name="author" content="Nguyễn Hoàng Ngọc Anh">
<script src="/games/anh-chung/dong-bo.js"></script>
<script>window.DEM_GIO_HAI_BE = true;</script>
<script src="/games/anh-chung/dem-gio.js" defer></script>
<link rel="manifest" href="/manifest.webmanifest">
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="../anh-chung/thong-tin.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Baloo 2",system-ui,sans-serif;color:#2b2340;background:#fff6e5}
body{background:#ffe9c4 url(anh/pho-cho-nhi-bia.webp) center/cover fixed}
.scr{display:none;min-height:100vh;padding:18px 3vw 90px}
.scr.on{display:block}
.panel{background:rgba(255,255,255,.93);border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:16px 20px;max-width:1200px;margin:0 auto 14px}
h1{font-size:clamp(30px,5vw,58px);margin:0;color:#d90479;text-shadow:0 3px 0 #fff}
h2{margin:0 0 8px;font-size:clamp(22px,3vw,34px)}
button{font-family:inherit;font-weight:700;font-size:20px;border:0;border-radius:16px;padding:10px 18px;cursor:pointer;background:#fff;color:#2b2340;box-shadow:0 4px 0 rgba(0,0,0,.18)}
button:focus-visible,button:focus{outline:5px solid #ffb703;outline-offset:3px}
.btn{background:#2ec4b6;color:#fff}.btn.pink{background:#d90479}.btn.org{background:#e85d04}.btn.gray{background:#8d86a3}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1200px;margin:0 auto 12px}
.top .sp{flex:1}
.kids{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.kid{display:flex;flex-direction:column;align-items:center;width:250px;padding:14px;font-size:26px}
.kid img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:6px solid #ff8fc7}
.kid.lucas img{border-color:#5aa9ff}
.kid small{font-size:16px;font-weight:500}
.jars{display:flex;gap:10px;flex-wrap:wrap}
.jar{flex:1;min-width:150px;border-radius:16px;padding:8px 12px;color:#fff;font-size:17px}
.jar b{font-size:28px;display:block}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.lv{padding:8px 2px;font-size:22px;border-radius:14px;line-height:1.1}
.lv small{display:block;font-size:14px;color:#e8a400;min-height:16px}
.lv.lock{opacity:.45}
.chang{margin:10px 0 4px;font-size:20px;color:#5a4d7a}
.stalls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stall{text-align:left;font-weight:500;font-size:18px;padding:14px;border:4px solid transparent;display:flex;flex-direction:column;gap:6px}
.stall b{font-size:21px}.stall .tot{font-size:26px;font-weight:800;color:#e85d04}
.stall .k{background:#ffb703;color:#fff;border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.stall.ok{border-color:#2ec4b6;background:#e2fff9}.stall.bad{border-color:#e63946;background:#ffecee}
.qtext{font-size:clamp(22px,2.8vw,32px);font-weight:700;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:clamp(20px,2.4vw,28px);text-align:left;padding:14px 18px}
.opt .k{display:inline-block;width:38px;height:38px;border-radius:50%;background:#7b5cff;color:#fff;text-align:center;margin-right:10px}
.opt.ok{background:#2ec4b6;color:#fff}.opt.bad{background:#e63946;color:#fff}
.fb{font-size:22px;min-height:34px;margin-top:10px;font-weight:700}
.bill{background:#fffbe8;border:3px dashed #e8a400;border-radius:16px;padding:12px 16px;font-size:21px;margin-top:10px}
.bill .big{font-size:28px;color:#d90479;font-weight:800}
.prog{height:16px;background:#eee;border-radius:9px;overflow:hidden;margin:6px 0 10px}.prog i{display:block;height:100%;background:#2ec4b6;transition:width .4s}
.wallet{font-size:22px;font-weight:800;background:#fff;border-radius:14px;padding:6px 14px}
.wallet img,.xu{width:1.1em;height:1.1em;vertical-align:-.2em}
.stars{font-size:54px;letter-spacing:6px}
.modal{position:fixed;inset:0;background:rgba(30,20,50,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.on{display:flex}
.modal .panel{max-width:760px;width:100%;max-height:92vh;overflow:auto}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.perk{text-align:left;font-size:19px}.perk span{float:right;color:#d90479}
.perk:disabled{opacity:.45}
.hist{font-size:15px;color:#5a4d7a;max-height:140px;overflow:auto}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero img.bg{width:min(520px,100%);border-radius:18px}
@media (max-width:760px){.map{grid-template-columns:repeat(5,1fr)}.stalls,.opts,.perks{grid-template-columns:1fr}.kid{width:44vw}.kid img{width:110px;height:110px}}
</style>
</head>
<body>

<!-- BÌA -->
<section id="sBia" class="scr on">
  <div class="panel" style="text-align:center">
    <h1>🏪 Phố Chợ Nhí</h1>
    <div style="font-size:24px">Lucie &amp; Lucas đi chợ tiết kiệm và làm chủ sạp tài ba!</div>
    <div class="kids">
      <button class="kid lucie" data-be="lucie"><img id="fLucie" alt="Lucie"><span>Lucie</span><small><span data-hs="lucie.goi">Tường San</span> · lớp <span data-hs="lucie.lop">3</span></small><small>Phím 1</small></button>
      <button class="kid lucas" data-be="lucas"><img id="fLucas" alt="Lucas"><span>Lucas</span><small><span data-hs="lucas.goi">Tường Minh</span> · lớp <span data-hs="lucas.lop">1</span></small><small>Phím 2</small></button>
    </div>
    <button class="btn pink" id="bHu">🫙 Bố mẹ đổi quà bằng Hũ Tiết Kiệm</button>
    <a href="/" style="display:inline-block;margin-left:10px"><button class="gray btn">🏠 Trang chủ</button></a>
  </div>
</section>

<!-- BẢN ĐỒ -->
<section id="sMap" class="scr">
  <div class="top"><button class="btn gray" id="bVe">⬅ Đổi bạn</button><div class="wallet" id="wMap"></div><div class="sp"></div><button class="btn pink" id="bHu2">🫙 Hũ Tiết Kiệm</button></div>
  <div class="panel"><h2 id="mapTitle"></h2><div class="jars" id="jars"></div></div>
  <div class="panel" id="map"></div>
</section>

<!-- ĐI CHỢ -->
<section id="sCho" class="scr">
  <div class="top"><button class="btn gray" data-back>⬅ Bản đồ</button><div class="wallet" id="wCho"></div><div class="sp"></div><button id="docCho">🔊 Đọc</button></div>
  <div class="panel">
    <h2 id="choTen"></h2>
    <div id="choThoiTiet" style="font-size:19px;color:#5a4d7a"></div>
    <div class="qtext" id="choYC"></div>
    <div style="font-size:18px">Bước 1 · Đi Chợ Tiết Kiệm — chọn quầy bằng phím 1, 2, 3</div>
  </div>
  <div class="panel"><div class="stalls" id="stalls"></div><div id="choFb"></div></div>
</section>

<!-- CHỦ SẠP -->
<section id="sSap" class="scr">
  <div class="top"><button class="btn gray" data-back>⬅ Bản đồ</button><div class="wallet" id="wSap"></div><div class="sp"></div><button id="docSap">🔊 Đọc</button></div>
  <div class="panel">
    <div style="font-size:18px" id="sapHd"></div>
    <div class="prog"><i id="sapProg"></i></div>
    <div class="qtext" id="sapQ"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="sapFb"></div>
  </div>
</section>

<!-- KẾT QUẢ -->
<section id="sKq" class="scr">
  <div class="panel" style="text-align:center">
    <h2 id="kqTen"></h2>
    <div class="stars" id="kqSao"></div>
    <div style="font-size:22px" id="kqTxt"></div>
    <div class="jars" id="kqJars" style="margin:12px 0"></div>
    <div id="kqMon" style="font-size:20px"></div>
    <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" id="kqTiep">Phiên tiếp theo ➡</button>
      <button class="btn org" id="kqLai">🔁 Chơi lại miễn phí</button>
      <button class="btn gray" data-back>🗺️ Bản đồ</button>
    </div>
  </div>
</section>

<!-- HŨ TIẾT KIỆM -->
<div class="modal" id="mHu"><div class="panel">
  <h2>🫙 Đổi quà ngoài đời bằng Hũ Tiết Kiệm</h2>
  <div style="font-size:17px">Mỗi phiên chợ, 20% số CIECAS con kiếm được vào Hũ Tiết Kiệm. Cuối tuần bố mẹ mở ở đây để con tự đổi thành đặc quyền nhỏ ở nhà.</div>
  <div class="kids" id="huKids" style="margin:8px 0"></div>
  <div class="perks" id="perks"></div>
  <div class="fb" id="huFb"></div>
  <div class="hist" id="huHist"></div>
  <div style="text-align:right;margin-top:8px"><button class="btn gray" id="huDong">Đóng</button></div>
</div></div>

<script>
const D = window.PCN, LV = D.levels, R = D.quy_tac_3_hu;
const XU = '<img class="xu" src="../anh-chung/xu-ciecas-nho.webp" alt="">';
const PERKS = [
  { id: "truyen", icon: "📖", ten: "Đọc thêm 1 truyện trước khi ngủ", gia: 10 },
  { id: "hoathinh", icon: "📺", ten: "Thêm 15 phút xem hoạt hình", gia: 15 },
  { id: "kem", icon: "🍦", ten: "Một que kem", gia: 20 },
  { id: "monan", icon: "🍲", ten: "Chọn món ăn tối Chủ nhật", gia: 30 },
  { id: "banh", icon: "🧁", ten: "Cùng mẹ làm bánh", gia: 40 },
  { id: "congvien", icon: "🎡", ten: "Đi công viên cuối tuần", gia: 60 }
];
const VUI = [[3, "1 cây kẹo mút"], [5, "1 que kem"], [8, "1 hộp sữa chua"], [12, "1 chiếc bánh mì"], [99, "1 cuốn truyện tranh nhỏ"]];
const KHEN = ["Giỏi quá!", "Chính xác!", "Tuyệt vời!", "Chủ sạp tài ba!", "Đúng rồi, con tính nhanh quá!"];
const DV = ["Chưa đúng rồi, con xem lại nhé!", "Không sao, lần sau con sẽ đúng!", "Cố lên con!"];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TEN = { lucie: "Lucie", lucas: "Lucas" };
let be = null, lv = 0, ses = null;

// ---------- lưu trữ ----------
function doc(c) { try { return Object.assign({ sao: {}, cup: 0, hu: { von: 0, nangcap: 0, tietkiem: 0 }, vi: 0, lichSu: [] }, JSON.parse(localStorage.getItem("phocho_" + c) || "{}")); } catch (e) { return { sao: {}, cup: 0, hu: { von: 0, nangcap: 0, tietkiem: 0 }, vi: 0, lichSu: [] }; } }
function ghi(c, o) { o.cup = Object.values(o.sao).filter(s => s >= 3).length; try { localStorage.setItem("phocho_" + c, JSON.stringify(o)); } catch (e) {} }
function nhatKy(c, s, q, ok) {
  try { const k = "giaDinh_nhatKy", a = JSON.parse(localStorage.getItem(k) || "[]");
    a.push({ t: Date.now(), g: "phocho", c, s, q: String(q).slice(0, 140), ok: !!ok });
    if (a.length > 6000) a.splice(0, a.length - 6000); localStorage.setItem(k, JSON.stringify(a)); } catch (e) {}
}

// ---------- âm thanh & giọng ----------
let AC = null;
function tone(f, d = .12, t = "triangle", v = .15, w = 0) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination); const s = AC.currentTime + w; o.start(s); g.gain.exponentialRampToValueAtTime(.001, s + d); o.stop(s + d + .02); } catch (e) {} }
const sDung = () => { tone(660); tone(880, .12, "triangle", .15, .1); tone(1320, .2, "triangle", .12, .2); };
const sSai = () => { tone(220, .25, "sawtooth", .08); };
const sXu = () => { [988, 1319, 1568].forEach((f, i) => tone(f, .1, "square", .05, i * .07)); };
function noi(t, en) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = en ? "en-US" : "vi-VN"; u.rate = be === "lucas" ? .9 : 1; speechSynthesis.speak(u); } catch (e) {} }

// ---------- màn hình ----------
function show(id) { $$(".scr").forEach(s => s.classList.toggle("on", s.id === id)); const f = document.querySelector("#" + id + " button:not([disabled])"); if (f) setTimeout(() => f.focus(), 30); }
function md(c) { return LV[lv].che_do_di_cho_tiet_kiem[c === "lucie" ? "lucie_lop_3" : "lucas_lop_1"]; }
function qs(c) { return LV[lv].che_do_chu_sap_tai_ba[c === "lucie" ? "lucie_lop_3" : "lucas_lop_1"]; }
function wallet() { const o = doc(be); return `<img src="${MatThat.url(be)}" style="width:34px;height:34px;border-radius:50%;vertical-align:middle"> ${TEN[be]} · Ví chợ ${XU} <b>${o.vi}</b>`; }
function jarsHTML(o, add) {
  return [["von", R.hu_von], ["nangcap", R.hu_nang_cap], ["tietkiem", R.hu_tiet_kiem]].map(([k, r]) =>
    `<div class="jar" style="background:${r.mau}">${r.ten} (${r.ti_le}%)<b>${XU} ${o.hu[k]}${add ? ` <small style="font-size:18px">+${add[k]}</small>` : ""}</b></div>`).join("");
}

$("#fLucie").src = MatThat.url("lucie"); $("#fLucas").src = MatThat.url("lucas");
$$(".kid[data-be]").forEach(b => b.onclick = () => chonBe(b.dataset.be));
function chonBe(c) { be = c; veMap(); show("sMap"); noi(c === "lucie" ? "Chào Lu Xi! Hôm nay con mở sạp ở Phố Chợ Nhí nhé!" : "Chào Lu Cát! Mình cùng đi chợ nào!"); }
$("#bVe").onclick = () => show("sBia");
$$("[data-back]").forEach(b => b.onclick = () => { veMap(); show("sMap"); });

function veMap() {
  const o = doc(be);
  $("#wMap").innerHTML = wallet();
  $("#mapTitle").innerHTML = `Bản đồ Phố Chợ của ${TEN[be]} · 🏆 ${o.cup}/30 phiên 3 sao`;
  $("#jars").innerHTML = jarsHTML(o);
  let h = "", mo = 0; while (mo < 30 && o.sao[LV[mo].so] !== undefined) mo++;
  const TC = ["Chặng 1 · Sân Nhà & Chợ Xóm", "Chặng 2 · Chợ Phường Rộn Ràng", "Chặng 3 · Phố Chợ Lớn"];
  for (let ch = 1; ch <= 3; ch++) {
    h += `<div class="chang">${TC[ch - 1]}</div><div class="map">`;
    LV.forEach((L, i) => { if (L.chang !== ch) return; const s = o.sao[L.so], khoa = i > mo;
      h += `<button class="lv ${khoa ? "lock" : ""}" data-i="${i}" style="background:${khoa ? "#ddd" : L.mau_chu_dao};color:#fff" ${khoa ? "disabled" : ""} title="${L.ten}">${khoa ? "🔒" : L.so}<small>${s !== undefined ? "★".repeat(s) + "☆".repeat(3 - s) : ""}</small></button>`; });
    h += "</div>";
  }
  $("#map").innerHTML = h;
  $$(".lv[data-i]").forEach(b => b.onclick = () => batDau(+b.dataset.i));
}

// ---------- BƯỚC 1: ĐI CHỢ ----------
function batDau(i) {
  lv = i; const L = LV[lv], m = md(be);
  ses = { toiUu: false, phat: 0, dung: 0, qi: 0, lanCho: 0 };
  document.body.style.backgroundImage = `url(${L.anh_nen})`;
  $("#wCho").innerHTML = wallet();
  $("#choTen").textContent = L.ten;
  $("#choThoiTiet").textContent = "☀️ " + L.thoi_tiet.ten + " — " + L.thoi_tiet.goi_y;
  $("#choYC").textContent = m.yeu_cau;
  $("#choFb").innerHTML = "";
  $("#stalls").innerHTML = m.cac_quay.map((q, k) => `<button class="stall" data-k="${k}"><span><span class="k">${k + 1}</span> <b>${q.ten_quay}</b></span><span>${q.mo_ta}</span><span class="tot">${XU} ${q.tong_ciecas} CIECAS</span></button>`).join("");
  $$(".stall").forEach(b => b.onclick = () => chonQuay(+b.dataset.k));
  show("sCho");
  if (be === "lucas") noi(m.doc_yeu_cau);
}
$("#docCho").onclick = () => noi(md(be).doc_yeu_cau + " " + md(be).cac_quay.map((q, k) => "Quầy " + (k + 1) + ": " + q.tong_ciecas + " xu.").join(" "));

function vuiVe(n) { return VUI.find(v => n <= v[0])[1]; }
function chonQuay(k) {
  if (ses.xongCho) return;
  const m = md(be), q = m.cac_quay[k], toiUu = m.cac_quay.find(x => x.la_toi_uu), o = doc(be);
  const btn = $$(".stall")[k];
  ses.lanCho++;
  nhatKy(be, "Đi chợ", m.yeu_cau, q.la_toi_uu);
  if (q.la_toi_uu) {
    btn.classList.add("ok"); sDung(); ses.xongCho = true; ses.toiUu = ses.lanCho === 1;
    const tk = m.tiet_kiem_duoc_ciecas;
    $("#choFb").innerHTML = `<div class="bill">🧾 <b>Hóa đơn tiết kiệm</b><br>${q.ly_do}<br><span class="big">Tiết kiệm được ${tk} CIECAS — vừa đủ mua thêm ${vuiVe(tk)}!</span>${ses.toiUu ? `<br>🏅 Thưởng Đi Chợ Thông Minh: +${LV[lv].phan_thuong.thuong_di_cho_toi_uu} CIECAS` : ""}</div>
      <div style="margin-top:10px"><button class="btn" id="bSap">Mở sạp bán hàng ➡</button></div>`;
    noi(q.ly_do + " Tiết kiệm được " + tk + " xu, vừa đủ mua thêm " + vuiVe(tk) + "!");
    $("#bSap").onclick = batDauSap; $("#bSap").focus();
  } else {
    btn.classList.add("bad"); btn.disabled = true; sSai();
    // Khóa an toàn ví: chỉ trừ phần chênh lệch nhỏ (tối đa 3), không bao giờ âm ví
    const chenh = Math.max(0, q.tong_ciecas - toiUu.tong_ciecas), tru = Math.min(chenh, 3, o.vi);
    if (tru > 0) { o.vi -= tru; ghi(be, o); ses.phat += tru; }
    $("#wCho").innerHTML = wallet();
    $("#choFb").innerHTML = `<div class="bill" style="border-color:#e63946">🤔 ${q.ly_do}${tru ? `<br>Ví chợ bớt ${tru} CIECAS (phần chênh lệch nhỏ).` : "<br>Ví chợ không bị trừ."} Con chọn lại quầy khác nhé!</div>`;
    noi(q.ly_do + " Con chọn lại nhé!");
  }
}

// ---------- BƯỚC 2: CHỦ SẠP ----------
function batDauSap() { ses.qi = 0; ses.dung = 0; $("#wSap").innerHTML = wallet(); hienCau(); show("sSap"); }
function hienCau() {
  const q = qs(be)[ses.qi]; ses.khoa = false;
  $("#sapHd").textContent = `Bước 2 · Chủ Sạp Tài Ba — câu ${ses.qi + 1}/10 · đúng ${ses.dung} · phím 1-4`;
  $("#sapProg").style.width = (ses.qi * 10) + "%";
  $("#sapQ").textContent = q.cau;
  $("#sapFb").textContent = "";
  $("#opts").innerHTML = q.lua_chon.map((t, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span>${t}</button>`).join("");
  $$(".opt").forEach(b => b.onclick = () => traLoi(+b.dataset.k));
  $(".opt").focus();
  if (be === "lucas") noi(q.doc || q.cau);
}
$("#docSap").onclick = () => { const q = qs(be)[ses.qi]; noi((q.doc || q.cau) + " " + q.lua_chon.map((t, k) => (k + 1) + ": " + t).join(". ")); };
async function traLoi(k) {
  if (ses.khoa) return; ses.khoa = true;
  const q = qs(be)[ses.qi], ok = k === q.dap_an_index, bs = $$(".opt");
  nhatKy(be, "Toán", q.cau, ok);
  bs[q.dap_an_index].classList.add("ok");
  if (ok) { ses.dung++; sDung(); const t = KHEN[Math.floor(Math.random() * KHEN.length)]; $("#sapFb").textContent = "✅ " + t + " " + q.giai_thich; noi(t); }
  else { bs[k].classList.add("bad"); sSai(); $("#sapFb").textContent = "💡 " + q.giai_thich; noi(DV[Math.floor(Math.random() * DV.length)] + " " + (q.doc_giai_thich || q.giai_thich)); }
  await sleep(ok ? 1500 : 3200);
  ses.qi++; if (ses.qi < 10) hienCau(); else ketThuc();
}

// ---------- KẾT QUẢ ----------
function ketThuc() {
  const L = LV[lv], P = L.phan_thuong, o = doc(be);
  const sao = ses.dung >= 9 && ses.toiUu ? 3 : ses.dung >= 7 ? 2 : 1;
  const tong = Math.round(P.ciecas_co_ban * ses.dung / 10) + (ses.toiUu ? P.thuong_di_cho_toi_uu : 0);
  const tk = Math.round(tong * R.hu_tiet_kiem.ti_le / 100), nc = Math.round(tong * R.hu_nang_cap.ti_le / 100), von = tong - tk - nc;
  o.hu.von += von; o.hu.nangcap += nc; o.hu.tietkiem += tk; o.vi += tong;
  const truoc = o.sao[L.so]; o.sao[L.so] = Math.max(truoc || 0, sao); ghi(be, o);
  sXu();
  document.body.style.backgroundImage = "url(anh/pho-cho-nhi-bep-nhi.webp)";
  $("#kqTen").textContent = L.ten;
  $("#kqSao").textContent = "★".repeat(sao) + "☆".repeat(3 - sao);
  $("#kqTxt").innerHTML = `Đúng ${ses.dung}/10 câu bán hàng · ${ses.toiUu ? "Đi chợ tối ưu ngay lần đầu 🏅" : "Đi chợ: lần sau chọn quầy tối ưu ngay nhé"}<br>Phiên này con kiếm được ${XU} <b>${tong} CIECAS</b>, chia vào 3 hũ:`;
  $("#kqJars").innerHTML = jarsHTML(o, { von, nangcap: nc, tietkiem: tk });
  $("#kqMon").innerHTML = `🍽️ Mở khóa món <b>${P.mo_khoa_mon_an}</b> cho Mâm Cơm Việt Nam!` + (sao < 3 ? `<br>Muốn gỡ 3 sao? Bấm <b>Chơi lại miễn phí</b>.` : "");
  $("#kqTiep").style.display = lv < 29 ? "" : "none";
  show("sKq");
  noi(sao === 3 ? "Tuyệt vời! Con được ba sao, đúng là chủ sạp tài ba!" : "Con được " + sao + " sao. Chơi lại để lấy ba sao nhé!");
  if (lv === 29 && sao === 3) setTimeout(() => noi("Chúc mừng con đã hoàn thành cả 30 phiên chợ! Mâm cơm Việt Nam đã đầy đủ rồi!"), 3500);
}
$("#kqTiep").onclick = () => batDau(lv + 1);
$("#kqLai").onclick = () => batDau(lv);

// ---------- HŨ TIẾT KIỆM (bố mẹ) ----------
let huBe = "lucie";
function moHu() { huBe = be || "lucie"; veHu(); $("#mHu").classList.add("on"); setTimeout(() => $("#mHu button").focus(), 30); }
$("#bHu").onclick = moHu; $("#bHu2").onclick = moHu; $("#huDong").onclick = () => $("#mHu").classList.remove("on");
function veHu(msg) {
  const o = doc(huBe);
  $("#huKids").innerHTML = ["lucie", "lucas"].map(c => { const x = doc(c); return `<button class="kid ${c}" data-hb="${c}" style="width:220px;${c === huBe ? "outline:5px solid #d90479" : ""}"><img src="${MatThat.url(c)}" style="width:80px;height:80px" alt=""><span>${TEN[c]}</span><small>Hũ Tiết Kiệm: ${x.hu.tietkiem} CIECAS</small></button>`; }).join("");
  $$("[data-hb]").forEach(b => b.onclick = () => { huBe = b.dataset.hb; veHu(); });
  $("#perks").innerHTML = PERKS.map(p => `<button class="perk" data-p="${p.id}" ${o.hu.tietkiem < p.gia ? "disabled" : ""}>${p.icon} ${p.ten}<span>${XU} ${p.gia}</span></button>`).join("");
  $$("[data-p]").forEach(b => b.onclick = () => doiQua(b.dataset.p));
  $("#huFb").innerHTML = msg || "";
  $("#huHist").innerHTML = o.lichSu.length ? "Đã đổi: " + o.lichSu.slice(-10).reverse().map(h => `${new Date(h.t).toLocaleDateString("vi-VN")} ${h.ten} (-${h.gia})`).join(" · ") : "";
}
function doiQua(id) {
  const p = PERKS.find(x => x.id === id), o = doc(huBe);
  if (o.hu.tietkiem < p.gia) return;
  if (!confirm(`Bố mẹ xác nhận: ${TEN[huBe]} đổi ${p.gia} CIECAS lấy "${p.ten}"?`)) return;
  o.hu.tietkiem -= p.gia; o.lichSu.push({ t: Date.now(), ten: p.ten, gia: p.gia }); ghi(huBe, o);
  sXu(); veHu(`🎉 ${TEN[huBe]} đã đổi được ${p.icon} ${p.ten}! Bố mẹ nhớ thực hiện nhé.`);
  noi(TEN[huBe] + " đã đổi được " + p.ten + "!");
}

// ---------- phím tắt ----------
addEventListener("keydown", e => {
  const n = +e.key; if (!(n >= 1 && n <= 9)) return;
  if ($("#mHu").classList.contains("on")) return;
  const s = $(".scr.on").id;
  if (s === "sBia" && n <= 2) chonBe(n === 1 ? "lucie" : "lucas");
  else if (s === "sCho" && n <= 3) { const b = $$(".stall")[n - 1]; if (b && !b.disabled) chonQuay(n - 1); }
  else if (s === "sSap" && n <= 4) traLoi(n - 1);
});
window.__tm = () => ({ scr: $(".scr.on").id, be, lv, ses });
</script>
